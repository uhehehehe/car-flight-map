<style>

<script>

/* =====================================================
   設定
===================================================== */

const ROUTE_RECALC_INTERVAL = 30000;

const ROUTE_RECALC_DISTANCE = 150;

const SCREEN_INTERVAL = 10000;


/* =====================================================
   グローバル変数
===================================================== */

let map;

let Route;

let AdvancedMarkerElement;

let currentPosition = null;

let destinationPosition = null;

let destinationName = "";

let destinationMarker = null;

let carMarker = null;

let currentRoute = null;

let routePolyline = null;

let traveledPolyline = null;

let traveledPath = [];

let routeViewport = null;

let initialRouteDistance = null;

let lastRouteCalculationPosition = null;

let currentScreen = 0;

let screenTimer = null;

let watchId = null;


/* =====================================================
   Google Maps 初期化
===================================================== */

async function initMap() {

    const { Map } =
        await google.maps.importLibrary("maps");

    const routesLibrary =
        await google.maps.importLibrary("routes");

    const markerLibrary =
        await google.maps.importLibrary("marker");


    Route = routesLibrary.Route;

    AdvancedMarkerElement =
        markerLibrary.AdvancedMarkerElement;


    map = new Map(
        document.getElementById("map"),
        {

            center: {
                lat: 35.681236,
                lng: 139.767125
            },

            zoom: 12,

            mapId: "DEMO_MAP_ID",

            disableDefaultUI: true,

            gestureHandling: "greedy"

        }
    );


    startGPS();

    startScreenTimer();

}


/* =====================================================
   GPS開始
===================================================== */

function startGPS() {

    if (!navigator.geolocation) {

        document.getElementById(
            "gpsStatus"
        ).textContent =
            "GPS NOT AVAILABLE";

        return;
    }


    document.getElementById(
        "gpsStatus"
    ).textContent =
        "GPS STARTING...";


    watchId =
        navigator.geolocation.watchPosition(

            handleGPS,

            handleGPSError,

            {

                enableHighAccuracy: true,

                maximumAge: 3000,

                timeout: 15000

            }

        );

}


/* =====================================================
   GPS更新
===================================================== */

function handleGPS(position) {

    const newPosition = {

        lat: position.coords.latitude,

        lng: position.coords.longitude

    };


    currentPosition = newPosition;


    const accuracy =
        Math.round(
            position.coords.accuracy
        );


    document.getElementById(
        "gpsAccuracy"
    ).textContent =
        `±${accuracy}m`;


    document.getElementById(
        "gpsStatus"
    ).textContent =
        `GPS追跡中　精度 ±${accuracy}m`;


    updateCarMarker();


    recordTraveledPath(
        currentPosition
    );


    /*
       目的地が設定されている場合
       ルートを自動更新
    */

    if (
        destinationPosition
    ) {

        if (
            !lastRouteCalculationPosition
        ) {

            calculateRoute();

        } else {

            const distance =
                distanceBetween(
                    lastRouteCalculationPosition,
                    currentPosition
                );


            if (
                distance >=
                ROUTE_RECALC_DISTANCE
            ) {

                calculateRoute();

            }

        }

    }


    /*
       現在位置画面なら中央追従
    */

    if (
        currentScreen === 1
    ) {

        map.setCenter(
            currentPosition
        );

    }

}


/* =====================================================
   GPSエラー
===================================================== */

function handleGPSError(error) {

    document.getElementById(
        "gpsStatus"
    ).textContent =
        "GPS ERROR";

}


/* =====================================================
   車マーカー
===================================================== */

function updateCarMarker() {

    if (!currentPosition) {
        return;
    }


    if (!carMarker) {

        const carElement =
            document.createElement("div");


        carElement.style.fontSize =
            "30px";


        carElement.textContent =
            "🚗";


        carMarker =
            new AdvancedMarkerElement({

                map: map,

                position:
                    currentPosition,

                content:
                    carElement,

                title:
                    "現在位置"

            });

    } else {

        carMarker.position =
            currentPosition;

    }

}


/* =====================================================
   走行済みルート記録
===================================================== */

function recordTraveledPath(
    position
) {

    if (!position) {
        return;
    }


    /*
       初回
    */

    if (
        traveledPath.length === 0
    ) {

        traveledPath.push({

            lat: position.lat,

            lng: position.lng

        });


        drawTraveledPath();

        return;
    }


    const last =
        traveledPath[
            traveledPath.length - 1
        ];


    const distance =
        distanceBetween(
            last,
            position
        );


    /*
       10m未満は記録しない
    */

    if (
        distance < 10
    ) {

        return;

    }


    traveledPath.push({

        lat: position.lat,

        lng: position.lng

    });


    drawTraveledPath();

}


/* =====================================================
   走行済みルート描画
===================================================== */

function drawTraveledPath() {

    if (
        traveledPath.length < 2
    ) {

        return;

    }


    if (
        traveledPolyline
    ) {

        traveledPolyline.setMap(
            null
        );

    }


    traveledPolyline =
        new google.maps.Polyline({

            path:
                traveledPath,

            map:
                map,

            strokeColor:
                "#777777",

            strokeOpacity:
                0.9,

            strokeWeight:
                8,

            zIndex:
                2

        });

}


/* =====================================================
   距離計算
===================================================== */

function distanceBetween(
    a,
    b
) {

    const R =
        6371000;


    const lat1 =
        a.lat *
        Math.PI /
        180;


    const lat2 =
        b.lat *
        Math.PI /
        180;


    const dLat =
        (b.lat - a.lat) *
        Math.PI /
        180;


    const dLng =
        (b.lng - a.lng) *
        Math.PI /
        180;


    const x =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(lat1) *
        Math.cos(lat2) *

        Math.sin(dLng / 2) *
        Math.sin(dLng / 2);


    return (
        2 *
        R *
        Math.atan2(
            Math.sqrt(x),
            Math.sqrt(1 - x)
        )
    );

}


/* =====================================================
   目的地検索
===================================================== */

async function searchDestination() {

    const input =
        document.getElementById(
            "destinationInput"
        );


    const value =
        input.value.trim();


    if (!value) {

        alert(
            "目的地を入力してください"
        );

        return;

    }


    if (!currentPosition) {

        alert(
            "GPS位置を取得中です。少し待ってから検索してください。"
        );

        return;

    }


    document.getElementById(
        "gpsStatus"
    ).textContent =
        "目的地を検索中...";


    try {

        const geocoder =
            new google.maps.Geocoder();


        const result =
            await geocoder.geocode({

                address: value

            });


        if (
            !result.results ||
            result.results.length === 0
        ) {

            throw new Error(
                "目的地が見つかりません"
            );

        }


        const location =
            result.results[0]
                .geometry
                .location;


        destinationPosition = {

            lat: location.lat(),

            lng: location.lng()

        };


        destinationName =
            result.results[0]
                .formatted_address;


        /*
           入力した名称を表示
        */

        document.getElementById(
            "destinationName"
        ).textContent =
            value;


        document.getElementById(
            "weatherDestination"
        ).textContent =
            value;


        /*
           古い目的地マーカー削除
        */

        if (
            destinationMarker
        ) {

            destinationMarker.setMap(
                null
            );

        }


        /*
           新しい目的地マーカー
        */

        destinationMarker =
            new AdvancedMarkerElement({

                map: map,

                position:
                    destinationPosition,

                title:
                    value

            });


        /*
           新しい旅として距離をリセット
        */

        initialRouteDistance =
            null;


        lastRouteCalculationPosition =
            null;


        /*
           ルート計算
        */

        await calculateRoute();


        /*
           全体画面へ
        */

        showScreen(0);


        document.getElementById(
            "gpsStatus"
        ).textContent =
            "GPS追跡中";


    } catch (error) {

        console.error(
            error
        );


        document.getElementById(
            "gpsStatus"
        ).textContent =
            "目的地を検索できませんでした";


        alert(
            "目的地を検索できませんでした"
        );

    }

}


/* =====================================================
   Enterキーでも検索
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const input =
            document.getElementById(
                "destinationInput"
            );


        input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    searchDestination();

                }

            }
        );

    }
);


/* =====================================================
   ルート計算
===================================================== */

async function calculateRoute() {

    if (
        !currentPosition ||
        !destinationPosition
    ) {

        return;

    }


    try {

        document.getElementById(
            "gpsStatus"
        ).textContent =
            "ROUTE CALCULATING...";


        /*
           現在地 → 目的地
        */

        const request = {

            origin:
                currentPosition,

            destination:
                destinationPosition,

            travelMode:
                "DRIVING",

            routingPreference:
                "TRAFFIC_AWARE",

            fields: [

                "path",

                "viewport",

                "distanceMeters",

                "durationMillis"

            ]

        };


        const result =
            await Route.computeRoutes(
                request
            );


        if (
            !result.routes ||
            result.routes.length === 0
        ) {

            throw new Error(
                "ルートが見つかりません"
            );

        }


        const route =
            result.routes[0];


        currentRoute =
            route;


        /*
           初回の総距離
        */

        if (
            initialRouteDistance === null
        ) {

            initialRouteDistance =
                route.distanceMeters;

        }


        /*
           次回再計算位置
        */

        lastRouteCalculationPosition = {

            lat:
                currentPosition.lat,

            lng:
                currentPosition.lng

        };


        /*
           残りルートを青で描画
        */

        drawRemainingRoute(
            route
        );


        /*
           全体表示用viewport
        */

        routeViewport =
            route.viewport;


        /*
           出発地点も含める
        */

        if (
            routeViewport &&
            currentPosition
        ) {

            routeViewport.extend(
                currentPosition
            );

        }


        if (
            routeViewport &&
            destinationPosition
        ) {

            routeViewport.extend(
                destinationPosition
            );

        }


        /*
           情報更新
        */

        updateRouteInfo(
            route
        );


        document.getElementById(
            "gpsStatus"
        ).textContent =
            "GPS追跡中";


    } catch (error) {

        console.error(
            "Route error:",
            error
        );


        document.getElementById(
            "gpsStatus"
        ).textContent =
            "ルートを取得できませんでした";

    }

}


/* =====================================================
   残りルート描画
===================================================== */

function drawRemainingRoute(
    route
) {

    /*
       前のルートを削除
    */

    if (
        routePolyline
    ) {

        routePolyline.setMap(
            null
        );

    }


    /*
       青いルート
    */

    const path =
        route.path.map(
            point => ({

                lat:
                    point.lat,

                lng:
                    point.lng

            })
        );


    routePolyline =
        new google.maps.Polyline({

            path:
                path,

            map:
                map,

            strokeColor:
                "#1976D2",

            strokeOpacity:
                0.95,

            strokeWeight:
                8,

            zIndex:
                3

        });

}


/* =====================================================
   ルート情報更新
===================================================== */

function updateRouteInfo(
    route
) {

    const distanceKm =
        route.distanceMeters /
        1000;


    /*
       残り距離
    */

    if (
        distanceKm >= 10
    ) {

        document.getElementById(
            "remainingDistance"
        ).textContent =
            `${distanceKm.toFixed(1)} km`;

    } else {

        document.getElementById(
            "remainingDistance"
        ).textContent =
            `${distanceKm.toFixed(2)} km`;

    }


    /*
       残り時間
    */

    const minutes =
        Math.round(
            route.durationMillis /
            60000
        );


    document.getElementById(
        "remainingTime"
    ).textContent =
        formatDuration(
            minutes
        );


    /*
       ETA
    */

    const eta =
        new Date(
            Date.now() +
            route.durationMillis
        );


    document.getElementById(
        "eta"
    ).textContent =
        formatTime(
            eta
        );


    /*
       進捗率
    */

    let progress = 0;


    if (
        initialRouteDistance &&
        route.distanceMeters <
        initialRouteDistance
    ) {

        progress =
            1 -
            (
                route.distanceMeters /
                initialRouteDistance
            );

    }


    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    const percent =
        Math.round(
            progress * 100
        );


    document.getElementById(
        "progressText"
    ).textContent =
        `${percent}%`;


    document.getElementById(
        "progressFill"
    ).style.width =
        `${percent}%`;

}


/* =====================================================
   時間フォーマット
===================================================== */

function formatDuration(
    minutes
) {

    if (
        minutes < 60
    ) {

        return `${minutes}分`;

    }


    const hours =
        Math.floor(
            minutes / 60
        );


    const mins =
        minutes % 60;


    return `${hours}時間${mins}分`;

}


/* =====================================================
   時刻フォーマット
===================================================== */

function formatTime(
    date
) {

    return date.toLocaleTimeString(
        "ja-JP",
        {

            hour:
                "2-digit",

            minute:
                "2-digit"

        }
    );

}


/* =====================================================
   画面タイマー
===================================================== */

function startScreenTimer() {

    if (
        screenTimer
    ) {

        clearInterval(
            screenTimer
        );

    }


    screenTimer =
        setInterval(

            () => {

                currentScreen++;


                if (
                    currentScreen > 2
                ) {

                    currentScreen = 0;

                }


                showScreen(
                    currentScreen
                );

            },

            SCREEN_INTERVAL

        );

}


/* =====================================================
   画面表示
===================================================== */

function showScreen(
    screen
) {

    currentScreen =
        screen;


    /*
       天気画面を非表示
    */

    document
        .getElementById(
            "weatherScreen"
        )
        .classList.remove(
            "visible"
        );


    /*
       インジケーター
    */

    for (
        let i = 0;
        i < 3;
        i++
    ) {

        document
            .getElementById(
                `dot${i}`
            )
            .classList.toggle(
                "active",
                i === screen
            );

    }


    /*
       全体
    */

    if (
        screen === 0
    ) {

        showOverview();

    }


    /*
       現在位置
    */

    if (
        screen === 1
    ) {

        showCurrentPosition();

    }


    /*
       天気
    */

    if (
        screen === 2
    ) {

        document
            .getElementById(
                "weatherScreen"
            )
            .classList.add(
                "visible"
            );


        loadWeather();

    }

}


/* =====================================================
   全体ルート画面
===================================================== */

function showOverview() {

    if (
        !map
    ) {

        return;

    }


    if (
        routeViewport
    ) {

        map.fitBounds(
            routeViewport,
            50
        );

    }

}


/* =====================================================
   現在位置拡大
===================================================== */

function showCurrentPosition() {

    currentScreen =
        1;


    document
        .getElementById(
            "weatherScreen"
        )
        .classList.remove(
            "visible"
        );


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        document
            .getElementById(
                `dot${i}`
            )
            .classList.toggle(
                "active",
                i === 1
            );

    }


    if (
        !currentPosition
    ) {

        return;

    }


    map.setCenter(
        currentPosition
    );


    map.setZoom(
        17
    );

}


/* =====================================================
   天気
===================================================== */

async function loadWeather() {

    if (
        !destinationPosition
    ) {

        return;

    }


    try {

        const lat =
            destinationPosition.lat;


        const lng =
            destinationPosition.lng;


        const url =
            `https://api.open-meteo.com/v1/forecast` +
            `?latitude=${lat}` +
            `&longitude=${lng}` +
            `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m` +
            `&timezone=auto`;


        const response =
            await fetch(
                url
            );


        const data =
            await response.json();


        const current =
            data.current;


        const weather =
            getWeatherInfo(
                current.weather_code
            );


        document.getElementById(
            "weatherIcon"
        ).textContent =
            weather.icon;


        document.getElementById(
            "weatherDescription"
        ).textContent =
            weather.text;


        document.getElementById(
            "weatherTemperature"
        ).textContent =
            `${Math.round(
                current.temperature_2m
            )}°`;


        document.getElementById(
            "weatherFeels"
        ).textContent =
            `体感 ${Math.round(
                current.apparent_temperature
            )}°`;


        document.getElementById(
            "weatherHumidity"
        ).textContent =
            `${current.relative_humidity_2m}%`;


        document.getElementById(
            "weatherWind"
        ).textContent =
            `${Math.round(
                current.wind_speed_10m
            )} km/h`;


        document.getElementById(
            "weatherUpdatedSmall"
        ).textContent =
            formatTime(
                new Date()
            );


    } catch (error) {

        console.error(
            "Weather error:",
            error
        );


        document.getElementById(
            "weatherDescription"
        ).textContent =
            "天気を取得できませんでした";

    }

}


/* =====================================================
   天気コード
===================================================== */

function getWeatherInfo(
    code
) {

    if (
        code === 0
    ) {

        return {

            icon: "☀️",

            text: "快晴"

        };

    }


    if (
        code === 1 ||
        code === 2
    ) {

        return {

            icon: "🌤️",

            text: "晴れ・一部曇り"

        };

    }


    if (
        code === 3
    ) {

        return {

            icon: "☁️",

            text: "曇り"

        };

    }


    if (
        code === 45 ||
        code === 48
    ) {

        return {

            icon: "🌫️",

            text: "霧"

        };

    }


    if (
        code >= 51 &&
        code <= 67
    ) {

        return {

            icon: "🌧️",

            text: "雨"

        };

    }


    if (
        code >= 71 &&
        code <= 77
    ) {

        return {

            icon: "❄️",

            text: "雪"

        };

    }


    if (
        code >= 80 &&
        code <= 82
    ) {

        return {

            icon: "🌦️",

            text: "にわか雨"

        };

    }


    if (
        code >= 95 &&
        code <= 99
    ) {

        return {

            icon: "⛈️",

            text: "雷雨"

        };

    }


    return {

        icon: "🌤️",

        text: "不明"

    };

}
