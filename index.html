<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>CAR FLIGHT MONITOR</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05080d;
        color: white;
        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
    }

    #app {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: row;
        background: #05080d;
    }

    /* =========================
       MAP
       ========================= */

    #map {
        flex: 1;
        height: 100%;
        min-width: 0;
        position: relative;
    }

    /* =========================
       RIGHT PANEL
       ========================= */

    #panel {
        width: 32%;
        min-width: 300px;
        max-width: 430px;
        height: 100%;
        background:
            linear-gradient(
                180deg,
                #0b111a 0%,
                #070b12 100%
            );

        border-left: 1px solid #263242;

        padding:
            max(16px, env(safe-area-inset-top))
            20px
            max(16px, env(safe-area-inset-bottom))
            20px;

        display: flex;
        flex-direction: column;

        overflow: hidden;
    }

    /* =========================
       HEADER
       ========================= */

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;

        margin-bottom: 12px;
    }

    .title {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #8ea1b8;
    }

    .live {
        display: flex;
        align-items: center;
        gap: 6px;

        font-size: 11px;
        letter-spacing: 1px;
        color: #63e6a5;
        font-weight: 700;
    }

    .live-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #63e6a5;
        box-shadow: 0 0 8px #63e6a5;
    }

    /* =========================
       DESTINATION
       ========================= */

    .destination-label {
        font-size: 10px;
        color: #72849a;
        letter-spacing: 2px;
        margin-top: 8px;
    }

    #destinationDisplay {
        font-size: clamp(22px, 3vw, 34px);
        font-weight: 700;
        line-height: 1.15;

        margin-top: 4px;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* =========================
       SEARCH
       ========================= */

    .search-area {
        display: flex;
        gap: 7px;
        margin-top: 12px;
    }

    #destinationInput {
        flex: 1;
        min-width: 0;

        height: 40px;

        border: 1px solid #344255;
        border-radius: 6px;

        background: #111925;
        color: white;

        padding: 0 11px;

        font-size: 14px;

        outline: none;
    }

    #destinationInput:focus {
        border-color: #6f829c;
    }

    #routeButton {
        height: 40px;

        border: 0;
        border-radius: 6px;

        padding: 0 13px;

        background: #e7edf5;
        color: #111820;

        font-size: 13px;
        font-weight: 700;

        white-space: nowrap;
    }

    #routeButton:active {
        transform: scale(0.97);
    }

    /* =========================
       MAIN NUMBERS
       ========================= */

    .main-info {
        margin-top: 18px;

        display: grid;
        grid-template-columns: 1fr 1fr;

        border-top: 1px solid #202c3a;
        border-bottom: 1px solid #202c3a;
    }

    .info-box {
        padding: 14px 8px;
    }

    .info-box + .info-box {
        border-left: 1px solid #202c3a;
    }

    .info-label {
        font-size: 10px;
        color: #71849a;
        letter-spacing: 1.5px;
        margin-bottom: 4px;
    }

    .info-value {
        font-size: clamp(23px, 3vw, 34px);
        font-weight: 700;
        line-height: 1;
    }

    .info-unit {
        font-size: 12px;
        color: #8b9bad;
        margin-left: 3px;
        font-weight: 400;
    }

    /* =========================
       ETA
       ========================= */

    .eta {
        margin-top: 14px;

        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }

    .eta-label {
        font-size: 10px;
        color: #71849a;
        letter-spacing: 2px;
    }

    #etaValue {
        font-size: clamp(27px, 3.5vw, 40px);
        font-weight: 700;
        letter-spacing: 1px;
    }

    /* =========================
       PROGRESS
       ========================= */

    .progress-area {
        margin-top: 16px;
    }

    .progress-header {
        display: flex;
        justify-content: space-between;

        font-size: 10px;
        color: #71849a;
        letter-spacing: 1px;
    }

    #progressPercent {
        color: white;
    }

    .progress-track {
        width: 100%;
        height: 5px;

        background: #273342;

        border-radius: 10px;

        margin-top: 7px;

        overflow: hidden;
    }

    #progressBar {
        width: 0%;
        height: 100%;

        background: #dfe8f2;

        border-radius: 10px;

        transition: width 0.5s ease;
    }

    /* =========================
       GPS / STATUS
       ========================= */

    .status-area {
        margin-top: auto;

        border-top: 1px solid #202c3a;

        padding-top: 12px;
    }

    #status {
        font-size: 12px;
        color: #a8b6c6;

        min-height: 17px;

        margin-bottom: 8px;
    }

    .gps-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    #gpsStatus {
        font-size: 11px;
        color: #63e6a5;
    }

    #gpsButton {
        border: 1px solid #39495c;
        background: #111925;
        color: #dbe4ed;

        border-radius: 5px;

        padding: 7px 10px;

        font-size: 11px;
    }

    #gpsButton:active {
        transform: scale(0.97);
    }

    /* =========================
       MOBILE PORTRAIT
       ========================= */

    @media (orientation: portrait) {

        #app {
            flex-direction: column;
        }

        #map {
            height: 58%;
            flex: none;
        }

        #panel {
            width: 100%;
            max-width: none;
            min-width: 0;

            height: 42%;

            border-left: 0;
            border-top: 1px solid #263242;

            padding:
                10px
                14px
                max(10px, env(safe-area-inset-bottom))
                14px;

            overflow-y: auto;
        }

        .main-info {
            margin-top: 10px;
        }

        .info-box {
            padding: 9px 6px;
        }

        .eta {
            margin-top: 8px;
        }

        .progress-area {
            margin-top: 9px;
        }

        .status-area {
            margin-top: 10px;
        }
    }

    /* =========================
       SMALL LANDSCAPE
       ========================= */

    @media (orientation: landscape) and (max-height: 500px) {

        #panel {
            width: 31%;
            min-width: 270px;

            padding-top: 10px;
            padding-bottom: 10px;
        }

        .destination-label {
            margin-top: 2px;
        }

        .search-area {
            margin-top: 7px;
        }

        .main-info {
            margin-top: 9px;
        }

        .info-box {
            padding: 9px 6px;
        }

        .eta {
            margin-top: 8px;
        }

        .progress-area {
            margin-top: 8px;
        }

        .status-area {
            padding-top: 8px;
        }
    }
</style>
</head>

<body>

<div id="app">

    <!-- MAP -->
    <div id="map"></div>

    <!-- INFORMATION PANEL -->
    <div id="panel">

        <div class="header">
            <div class="title">
                CAR FLIGHT MONITOR
            </div>

            <div class="live">
                <span class="live-dot"></span>
                LIVE
            </div>
        </div>

        <div class="destination-label">
            DESTINATION
        </div>

        <div id="destinationDisplay">
            ---
        </div>

        <div class="search-area">

            <input
                id="destinationInput"
                type="text"
                placeholder="目的地を入力"
                autocomplete="off"
            >

            <button id="routeButton">
                ROUTE
            </button>

        </div>

        <div class="main-info">

            <div class="info-box">

                <div class="info-label">
                    REMAINING
                </div>

                <div>
                    <span id="distanceValue">---</span>
                    <span class="info-unit">km</span>
                </div>

            </div>

            <div class="info-box">

                <div class="info-label">
                    TIME
                </div>

                <div>
                    <span id="timeValue">---</span>
                    <span class="info-unit">min</span>
                </div>

            </div>

        </div>

        <div class="eta">

            <div>
                <div class="eta-label">
                    ESTIMATED ARRIVAL
                </div>
            </div>

            <div id="etaValue">
                --:--
            </div>

        </div>

        <div class="progress-area">

            <div class="progress-header">

                <span>
                    TRIP PROGRESS
                </span>

                <span id="progressPercent">
                    0%
                </span>

            </div>

            <div class="progress-track">
                <div id="progressBar"></div>
            </div>

        </div>

        <div class="status-area">

            <div id="status">
                目的地を入力してください
            </div>

            <div class="gps-row">

                <div id="gpsStatus">
                    GPS待機中
                </div>

                <button id="gpsButton">
                    GPS START
                </button>

            </div>

        </div>

    </div>

</div>


<script>

let map;

let carMarker = null;

let currentPosition = null;

let destination = null;

let routeObject = null;

let routePolylines = [];

let initialRouteDistance = null;

let lastRouteUpdatePosition = null;

let gpsWatchId = null;

let firstRoute = true;


/* ========================================
   MAP INITIALIZATION
   ======================================== */

async function initMap() {

    try {

        const { Map } =
            await google.maps.importLibrary("maps");

        const { AdvancedMarkerElement } =
            await google.maps.importLibrary("marker");

        map = new Map(
            document.getElementById("map"),
            {
                center: {
                    lat: 35.681236,
                    lng: 139.767125
                },

                zoom: 12,

                mapId: "DEMO_MAP_ID",

                disableDefaultUI: true,

                gestureHandling: "greedy"
            }
        );

        document.getElementById("status").textContent =
            "GPSを取得しています…";

        startGPS();

    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "Google Mapsの初期化に失敗しました。";

    }
}


/* ========================================
   GPS
   ======================================== */

function startGPS() {

    if (!navigator.geolocation) {

        document.getElementById("gpsStatus").textContent =
            "GPS非対応";

        return;
    }

    document.getElementById("gpsStatus").textContent =
        "GPS取得中…";


    navigator.geolocation.getCurrentPosition(

        position => {

            updateGPS(position);

            watchGPS();

        },

        error => {

            console.error(error);

            document.getElementById("gpsStatus").textContent =
                "GPS取得失敗";

            document.getElementById("status").textContent =
                "位置情報を取得できませんでした。";

        },

        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 15000
        }

    );
}


/* ========================================
   GPS WATCH
   ======================================== */

function watchGPS() {

    if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
    }

    gpsWatchId =
        navigator.geolocation.watchPosition(

            position => {

                updateGPS(position);

            },

            error => {

                console.error(error);

                document.getElementById("gpsStatus").textContent =
                    "GPSエラー";

            },

            {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 15000
            }

        );
}


/* ========================================
   UPDATE GPS
   ======================================== */

function updateGPS(position) {

    const lat =
        position.coords.latitude;

    const lng =
        position.coords.longitude;

    const accuracy =
        position.coords.accuracy;

    currentPosition = {
        lat,
        lng
    };


    document.getElementById("gpsStatus").textContent =
        "GPS追跡中　精度 ±" +
        Math.round(accuracy) +
        "m";


    updateCarMarker();


    /*
     * 目的地が設定されている場合、
     * 150m以上移動したらルートを更新
     */

    if (
        destination &&
        lastRouteUpdatePosition
    ) {

        const moved =
            distanceBetween(
                currentPosition,
                lastRouteUpdatePosition
            );

        if (moved >= 150) {

            calculateRoute(false);

        }

    }
}


/* ========================================
   CAR MARKER
   ======================================== */

function updateCarMarker() {

    if (!map || !currentPosition) {
        return;
    }

    if (!carMarker) {

        const carElement =
            document.createElement("div");

        carElement.innerHTML = "🚗";

        carElement.style.fontSize = "30px";

        carElement.style.filter =
            "drop-shadow(0 2px 4px rgba(0,0,0,.7))";

        carMarker =
            new google.maps.marker.AdvancedMarkerElement({
                map: map,
                position: currentPosition,
                content: carElement,
                title: "現在地"
            });

    } else {

        carMarker.position =
            currentPosition;

    }
}


/* ========================================
   ROUTE BUTTON
   ======================================== */

document
    .getElementById("routeButton")
    .addEventListener(
        "click",
        calculateRouteFromInput
    );


document
    .getElementById("destinationInput")
    .addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {

                calculateRouteFromInput();

            }

        }
    );


/* ========================================
   SEARCH DESTINATION
   ======================================== */

async function calculateRouteFromInput() {

    const input =
        document
            .getElementById("destinationInput")
            .value
            .trim();

    if (!input) {

        document.getElementById("status").textContent =
            "目的地を入力してください。";

        return;
    }

    if (!currentPosition) {

        document.getElementById("status").textContent =
            "GPS位置を取得中です。少し待ってください。";

        return;
    }


    document.getElementById("status").textContent =
        "ルートを検索しています…";


    try {

        /*
         * Geocoderで住所・施設名を座標に変換
         */

        const geocoder =
            new google.maps.Geocoder();


        geocoder.geocode(
            {
                address: input,
                region: "JP"
            },

            results => {

                if (
                    !results ||
                    !results.length
                ) {

                    document.getElementById("status").textContent =
                        "目的地が見つかりませんでした。";

                    return;
                }


                const location =
                    results[0].geometry.location;


                destination = {

                    lat: location.lat(),
                    lng: location.lng(),

                    name:
                        results[0].formatted_address

                };


                document.getElementById(
                    "destinationDisplay"
                ).textContent = input;


                initialRouteDistance = null;

                firstRoute = true;

                calculateRoute(true);

            }
        );

    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "目的地の検索に失敗しました。";

    }
}


/* ========================================
   CALCULATE ROUTE
   ======================================== */

async function calculateRoute(fitMap) {

    if (
        !currentPosition ||
        !destination
    ) {
        return;
    }


    try {

        const { Route } =
            await google.maps.importLibrary("routes");


        const request = {

            origin: currentPosition,

            destination: destination,

            travelMode: "DRIVING",

            routingPreference:
                "TRAFFIC_AWARE",

            fields: [
                "path",
                "viewport",
                "distanceMeters",
                "durationMillis",
                "localizedValues",
                "legs"
            ]

        };


        const response =
            await Route.computeRoutes(request);


        if (
            !response ||
            !response.routes ||
            !response.routes.length
        ) {

            document.getElementById("status").textContent =
                "ルートを取得できませんでした。";

            return;
        }


        routeObject =
            response.routes[0];


        /*
         * 初回のルート距離を保存
         */

        if (
            initialRouteDistance === null
        ) {

            initialRouteDistance =
                routeObject.distanceMeters;

        }


        /*
         * ルート描画
         */

        clearRoute();


        routePolylines =
            routeObject.createPolylines({
                polylineOptions: {

                    strokeColor: "#4285F4",

                    strokeOpacity: 0.9,

                    strokeWeight: 6

                }
            });


        routePolylines.forEach(
            polyline => {

                polyline.setMap(map);

            }
        );


        /*
         * 地図を初回だけルート全体に合わせる
         */

        if (fitMap && routeObject.viewport) {

            map.fitBounds(
                routeObject.viewport,
                {
                    top: 40,
                    right: 40,
                    bottom: 40,
                    left: 40
                }
            );

        }


        /*
         * 最新GPS位置を記録
         */

        lastRouteUpdatePosition = {
            ...currentPosition
        };


        /*
         * 情報更新
         */

        updateRouteInformation();


        document.getElementById("status").textContent =
            "走行中";


    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "ルートを取得できませんでした。\n" +
            error.message;

    }
}


/* ========================================
   CLEAR ROUTE
   ======================================== */

function clearRoute() {

    routePolylines.forEach(
        polyline => {

            polyline.setMap(null);

        }
    );

    routePolylines = [];

}


/* ========================================
   ROUTE INFORMATION
   ======================================== */

function updateRouteInformation() {

    if (!routeObject) {
        return;
    }


    const distanceMeters =
        routeObject.distanceMeters || 0;

    const durationMillis =
        routeObject.durationMillis || 0;


    /*
     * km
     */

    const distanceKm =
        distanceMeters / 1000;


    document.getElementById(
        "distanceValue"
    ).textContent =
        distanceKm.toFixed(1);


    /*
     * minutes
     */

    const minutes =
        Math.max(
            0,
            Math.round(
                durationMillis / 60000
            )
        );


    document.getElementById(
        "timeValue"
    ).textContent =
        minutes;


    /*
     * ETA
     */

    const eta =
        new Date(
            Date.now() + durationMillis
        );


    const hours =
        String(
            eta.getHours()
        ).padStart(2, "0");


    const mins =
        String(
            eta.getMinutes()
        ).padStart(2, "0");


    document.getElementById(
        "etaValue"
    ).textContent =
        hours + ":" + mins;


    /*
     * progress
     */

    if (
        initialRouteDistance &&
        initialRouteDistance > 0
    ) {

        let progress =
            1 -
            (
                distanceMeters /
                initialRouteDistance
            );


        progress =
            Math.max(
                0,
                Math.min(
                    1,
                    progress
                )
            );


        const percent =
            Math.round(
                progress * 100
            );


        document.getElementById(
            "progressBar"
        ).style.width =
            percent + "%";


        document.getElementById(
            "progressPercent"
        ).textContent =
            percent + "%";

    }

}


/* ========================================
   DISTANCE BETWEEN GPS POINTS
   ======================================== */

function distanceBetween(a, b) {

    const R = 6371000;

    const lat1 =
        a.lat * Math.PI / 180;

    const lat2 =
        b.lat * Math.PI / 180;

    const dLat =
        (b.lat - a.lat) *
        Math.PI / 180;

    const dLng =
        (b.lng - a.lng) *
        Math.PI / 180;


    const x =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(lat1) *
        Math.cos(lat2) *

        Math.sin(dLng / 2) *
        Math.sin(dLng / 2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(x),
            Math.sqrt(1 - x)
        );


    return R * c;

}


/* ========================================
   GPS BUTTON
   ======================================== */

document
    .getElementById("gpsButton")
    .addEventListener(
        "click",
        () => {

            if (
                currentPosition &&
                map
            ) {

                map.setCenter(
                    currentPosition
                );

                map.setZoom(16);

            } else {

                startGPS();

            }

        }
    );


/* ========================================
   PERIODIC ROUTE UPDATE
   ======================================== */

setInterval(
    () => {

        if (
            destination &&
            currentPosition
        ) {

            calculateRoute(false);

        }

    },
    30000
);

</script>

    defer>
</script>

</body>
