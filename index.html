<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no,
           viewport-fit=cover"
>

<title>CAR FLIGHT MONITOR</title>

<style>
/* ========================================
   基本設定
======================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

#app {
  position: relative;

  width: 100vw;
  height: 100vh;
  height: 100dvh;

  overflow: hidden;
}

#map {
  position: absolute;

  left: 0;
  top: 0;
  right: 0;
  bottom: 0;

  width: 100%;
  height: 100%;
}


/* ========================================
   右側情報パネル
======================================== */

#panel {
  position: absolute;

  top: 0;
  right: 0;

  width: clamp(255px, 32vw, 320px);

  height: 100%;
  height: 100dvh;

  padding-top:
    max(10px, env(safe-area-inset-top));

  padding-right:
    max(12px, env(safe-area-inset-right));

  padding-bottom:
    max(10px, env(safe-area-inset-bottom));

  padding-left: 14px;

  background: rgba(10, 16, 24, 0.96);

  color: #fff;

  overflow: hidden;

  display: flex;
  flex-direction: column;

  z-index: 10;
}


/* ========================================
   タイトル
======================================== */

#panel h1 {
  margin: 2px 0 14px;

  font-size: 18px;
  font-weight: 500;

  letter-spacing: 3px;

  color: #9eb3d0;

  flex-shrink: 0;
}


/* ========================================
   DESTINATION
======================================== */

#panel label {
  display: block;

  margin-bottom: 5px;

  font-size: 12px;

  color: #9aa8bb;

  letter-spacing: 1px;

  flex-shrink: 0;
}


/* ========================================
   目的地入力
======================================== */

#destinationInput {
  display: block;

  width: 100%;
  min-width: 0;

  height: 38px;

  padding: 0 12px;

  border: 1px solid #68717c;

  border-radius: 9px;

  background: rgba(255,255,255,0.08);

  color: white;

  font-size: 16px;

  outline: none;

  flex-shrink: 0;
}

#destinationInput::placeholder {
  color: #8d98a7;
}


/* ========================================
   ルート検索ボタン
======================================== */

#searchButton {
  display: block;

  width: 100%;

  height: 36px;

  margin-top: 7px;

  padding: 0;

  border: none;

  border-radius: 8px;

  background: #1976d2;

  color: white;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;

  flex-shrink: 0;
}

#searchButton:active {
  background: #125ca5;
}


/* ========================================
   目的地名
======================================== */

#destinationName {
  margin-top: 15px;
  margin-bottom: 3px;

  font-size: clamp(18px, 2.3vw, 25px);

  font-weight: bold;

  line-height: 1.2;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  flex-shrink: 0;
}


/* ========================================
   残り距離
======================================== */

#remainingDistance {
  margin-top: 2px;

  font-size: clamp(38px, 5vw, 54px);

  line-height: 1.05;

  font-weight: 700;

  white-space: nowrap;

  flex-shrink: 0;
}


/* Remaining distance */
#remainingDistanceLabel {
  margin-top: 4px;

  font-size: 13px;

  color: #aab3c0;

  flex-shrink: 0;
}


/* ========================================
   情報行
======================================== */

.infoRow {
  display: flex;

  justify-content: space-between;
  align-items: center;

  min-height: 38px;

  border-bottom:
    1px solid rgba(255,255,255,0.15);

  flex-shrink: 0;
}

.infoLabel {
  font-size: 13px;

  color: #9ca9bb;
}

.infoValue {
  font-size: 18px;

  font-weight: bold;

  white-space: nowrap;
}


/* ========================================
   プログレスバー
======================================== */

#progressContainer {
  margin-top: 12px;

  flex-shrink: 0;
}

#progressBar {
  width: 100%;

  height: 7px;

  border-radius: 5px;

  background: rgba(255,255,255,0.15);

  overflow: hidden;
}

#progress {
  width: 0%;

  height: 100%;

  background: #1976d2;

  transition: width 0.5s ease;
}


/* ========================================
   GPSステータス
======================================== */

#gpsStatus {
  margin-top: 9px;

  font-size: 12px;

  color: #9ca9bb;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  flex-shrink: 0;
}


/* ========================================
   現在位置ボタン
======================================== */

#currentPositionButton {
  width: 100%;

  height: 34px;

  margin-top: 7px;

  padding: 0;

  border: 1px solid #596575;

  border-radius: 7px;

  background: rgba(255,255,255,0.06);

  color: white;

  font-size: 13px;

  cursor: pointer;

  flex-shrink: 0;
}

#currentPositionButton:active {
  background: rgba(255,255,255,0.15);
}


/* ========================================
   凡例
======================================== */

#legend {
  position: absolute;

  left: 12px;

  bottom:
    max(12px, env(safe-area-inset-bottom));

  padding: 8px 14px;

  border-radius: 10px;

  background: rgba(50,50,50,0.78);

  color: white;

  font-size: 13px;

  z-index: 20;

  pointer-events: none;
}

.legendItem {
  display: flex;

  align-items: center;

  gap: 8px;

  margin: 4px 0;

  white-space: nowrap;
}

.legendLine {
  width: 38px;

  height: 7px;

  border-radius: 5px;

  flex-shrink: 0;
}

.legendTraveled {
  background: #777;
}

.legendRemaining {
  background: #1976d2;
}


/* ========================================
   画面切り替えインジケーター
======================================== */

#screenIndicator {
  position: absolute;

  left: 50%;

  bottom:
    max(12px, env(safe-area-inset-bottom));

  transform: translateX(-50%);

  display: flex;

  gap: 7px;

  z-index: 25;

  pointer-events: none;
}

.screenDot {
  width: 8px;
  height: 8px;

  border-radius: 50%;

  background: rgba(255,255,255,0.35);
}

.screenDot.active {
  background: white;
}


/* ========================================
   天気画面
======================================== */

#weatherScreen {
  position: absolute;

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  padding-top:
    max(15px, env(safe-area-inset-top));

  padding-right:
    max(15px, env(safe-area-inset-right));

  padding-bottom:
    max(15px, env(safe-area-inset-bottom));

  padding-left:
    max(15px, env(safe-area-inset-left));

  background: #101720;

  color: white;

  z-index: 30;
}

#weatherInner {
  width: min(90vw, 650px);

  max-height: 90dvh;

  overflow: auto;

  text-align: center;
}

#weatherDestination {
  font-size: clamp(22px, 4vw, 34px);

  font-weight: bold;
}

#weatherIcon {
  font-size: clamp(50px, 9vw, 80px);

  margin: 8px 0;
}

#weatherTemp {
  font-size: clamp(42px, 8vw, 68px);

  font-weight: bold;
}

#weatherDescription {
  font-size: 16px;

  color: #b8c2cf;
}

.weatherGrid {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 8px;

  margin-top: 15px;
}

.weatherItem {
  padding: 8px;

  border-radius: 8px;

  background: rgba(255,255,255,0.08);
}

.weatherLabel {
  font-size: 11px;

  color: #9ca9bb;
}

.weatherValue {
  margin-top: 3px;

  font-size: 15px;

  font-weight: bold;
}

#weatherUpdated {
  margin-top: 12px;

  font-size: 11px;

  color: #7f8b9b;
}


/* ========================================
   縦画面
======================================== */

@media (orientation: portrait) {

  #panel {
    top: auto;
    bottom: 0;

    width: 100%;

    height: auto;

    max-height: 42dvh;

    padding-top: 10px;

    padding-right:
      max(14px, env(safe-area-inset-right));

    padding-bottom:
      max(10px, env(safe-area-inset-bottom));

    padding-left:
      max(14px, env(safe-area-inset-left));

    overflow: hidden;
  }


  #panel h1 {
    margin: 0 0 8px;

    font-size: 15px;
  }


  #destinationName {
    margin-top: 9px;

    font-size: 18px;
  }


  #remainingDistance {
    font-size: 38px;
  }


  .infoRow {
    min-height: 32px;
  }


  #legend {
    top: 10px;

    bottom: auto;

    left: 10px;
  }


  #screenIndicator {
    top: 10px;

    bottom: auto;
  }


  .weatherGrid {
    grid-template-columns:
      repeat(2, 1fr);
  }
}


/* ========================================
   iPhone横画面など
   高さが低い画面専用
======================================== */

@media (orientation: landscape) and (max-height: 430px) {

  #panel {
    padding-top: 7px;

    padding-bottom: 7px;
  }


  #panel h1 {
    margin-bottom: 7px;

    font-size: 15px;
  }


  #destinationInput {
    height: 34px;
  }


  #searchButton {
    height: 32px;

    margin-top: 5px;
  }


  #destinationName {
    margin-top: 9px;

    font-size: 19px;
  }


  #remainingDistance {
    font-size: 38px;
  }


  #remainingDistanceLabel {
    font-size: 11px;
  }


  .infoRow {
    min-height: 30px;
  }


  .infoLabel {
    font-size: 11px;
  }


  .infoValue {
    font-size: 15px;
  }


  #progressContainer {
    margin-top: 7px;
  }


  #gpsStatus {
    margin-top: 5px;

    font-size: 10px;
  }


  #currentPositionButton {
    height: 29px;

    margin-top: 4px;

    font-size: 11px;
  }


  #legend {
    font-size: 11px;

    padding: 6px 10px;
  }
}


/* ========================================
   さらに高さが低い端末
======================================== */

@media (orientation: landscape) and (max-height: 360px) {

  #panel {
    width: 280px;

    padding-top: 5px;
    padding-bottom: 5px;
  }

  #panel h1 {
    margin-bottom: 4px;

    font-size: 13px;
  }

  #panel label {
    margin-bottom: 3px;

    font-size: 10px;
  }

  #destinationInput {
    height: 30px;

    font-size: 14px;
  }

  #searchButton {
    height: 28px;

    margin-top: 4px;

    font-size: 13px;
  }

  #destinationName {
    margin-top: 6px;

    font-size: 17px;
  }

  #remainingDistance {
    font-size: 32px;
  }

  #remainingDistanceLabel {
    margin-top: 1px;

    font-size: 10px;
  }

  .infoRow {
    min-height: 26px;
  }

  .infoLabel {
    font-size: 10px;
  }

  .infoValue {
    font-size: 14px;
  }

  #progressContainer {
    margin-top: 5px;
  }

  #progressBar {
    height: 5px;
  }

  #gpsStatus {
    margin-top: 3px;

    font-size: 9px;
  }

  #currentPositionButton {
    height: 25px;

    margin-top: 3px;

    font-size: 10px;
  }
}
</style>
</head>


<body>

<div id="app">

  <!-- ====================================
       地図
  ===================================== -->
  <div id="map"></div>


  <!-- ====================================
       右側情報パネル
  ===================================== -->
  <div id="panel">

    <h1>CAR FLIGHT MONITOR</h1>

    <label for="destinationInput">
      DESTINATION
    </label>

    <input
      id="destinationInput"
      type="text"
      value="東京駅"
      placeholder="目的地を入力"
      autocomplete="off"
    >

    <button id="searchButton">
      ルート検索
    </button>


    <div id="destinationName">
      -
    </div>


    <div id="remainingDistance">
      -
    </div>

    <div id="remainingDistanceLabel">
      Remaining distance
    </div>


    <div class="infoRow">

      <span class="infoLabel">
        REMAINING TIME
      </span>

      <span
        class="infoValue"
        id="remainingTime"
      >
        -
      </span>

    </div>


    <div class="infoRow">

      <span class="infoLabel">
        ETA
      </span>

      <span
        class="infoValue"
        id="eta"
      >
        -
      </span>

    </div>


    <div id="progressContainer">

      <div id="progressBar">

        <div id="progress"></div>

      </div>

    </div>


    <div id="gpsStatus">
      GPS待機中
    </div>


    <button id="currentPositionButton">
      現在位置を見る
    </button>

  </div>


  <!-- ====================================
       凡例
  ===================================== -->
  <div id="legend">

    <div class="legendItem">

      <div
        class="legendLine legendTraveled"
      ></div>

      <span>走行済み</span>

    </div>


    <div class="legendItem">

      <div
        class="legendLine legendRemaining"
      ></div>

      <span>残りルート</span>

    </div>

  </div>


  <!-- ====================================
       画面インジケーター
  ===================================== -->
  <div id="screenIndicator">

    <div
      class="screenDot active"
      id="dot0"
    ></div>

    <div
      class="screenDot"
      id="dot1"
    ></div>

    <div
      class="screenDot"
      id="dot2"
    ></div>

  </div>


  <!-- ====================================
       天気画面
  ===================================== -->
  <div id="weatherScreen">

    <div id="weatherInner">

      <div id="weatherDestination">
        -
      </div>


      <div id="weatherIcon">
        ☀️
      </div>


      <div id="weatherTemp">
        -
      </div>


      <div id="weatherDescription">
        -
      </div>


      <div class="weatherGrid">

        <div class="weatherItem">

          <div class="weatherLabel">
            FEELS LIKE
          </div>

          <div
            class="weatherValue"
            id="weatherFeelsLike"
          >
            -
          </div>

        </div>


        <div class="weatherItem">

          <div class="weatherLabel">
            HUMIDITY
          </div>

          <div
            class="weatherValue"
            id="weatherHumidity"
          >
            -
          </div>

        </div>


        <div class="weatherItem">

          <div class="weatherLabel">
            WIND
          </div>

          <div
            class="weatherValue"
            id="weatherWind"
          >
            -
          </div>

        </div>

      </div>


      <div id="weatherUpdated">
        -
      </div>

    </div>

  </div>

</div>


<script>
/* ========================================
   設定
======================================== */

const ROUTE_RECALC_INTERVAL = 30000;

const ROUTE_RECALC_DISTANCE = 150;

const SCREEN_INTERVAL = 10000;


/* ========================================
   グローバル変数
======================================== */

let map;

let Route;

let AdvancedMarkerElement;

let currentPosition = null;

let destinationPosition = null;

let destinationName = "";

let destinationMarker = null;

let carMarker = null;

let currentRoute = null;

let routePolyline = null;

let traveledPolyline = null;

let traveledPath = [];

let routeViewport = null;

let initialRouteDistance = null;

let lastRouteCalculationPosition = null;

let currentScreen = 0;

let screenTimer = null;

let watchId = null;


/* ========================================
   地図初期化
======================================== */

async function initMap() {

  try {

    const { Map } =
      await google.maps.importLibrary("maps");

    const routesLibrary =
      await google.maps.importLibrary("routes");

    const markerLibrary =
      await google.maps.importLibrary("marker");


    Route =
      routesLibrary.Route;

    AdvancedMarkerElement =
      markerLibrary.AdvancedMarkerElement;


    map = new Map(
      document.getElementById("map"),
      {
        center: {
          lat: 35.681236,
          lng: 139.767125
        },

        zoom: 12,

        mapId: "DEMO_MAP_ID",

        disableDefaultUI: true,

        gestureHandling: "greedy"
      }
    );


    startGPS();

    startScreenTimer();

  } catch (error) {

    console.error(error);

    document.getElementById(
      "gpsStatus"
    ).textContent =
      "地図の初期化に失敗しました";

  }

}


/* ========================================
   GPS開始
======================================== */

function startGPS() {

  if (!navigator.geolocation) {

    document.getElementById(
      "gpsStatus"
    ).textContent =
      "GPSに対応していません";

    return;
  }


  watchId =
    navigator.geolocation.watchPosition(

      position => {

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;

        const accuracy =
          position.coords.accuracy;


        currentPosition = {
          lat: lat,
          lng: lng
        };


        document.getElementById(
          "gpsStatus"
        ).textContent =
          "GPS追跡中　精度 ±" +
          Math.round(accuracy) +
          "m";


        updateCarMarker();

        recordTraveledPath();


        if (
          destinationPosition &&
          lastRouteCalculationPosition
        ) {

          const moved =
            distanceBetween(
              currentPosition,
              lastRouteCalculationPosition
            );


          if (
            moved >=
            ROUTE_RECALC_DISTANCE
          ) {

            calculateRoute();

          }

        }


        if (currentScreen === 1) {

          map.setCenter(
            currentPosition
          );

        }

      },

      error => {

        console.error(error);

        document.getElementById(
          "gpsStatus"
        ).textContent =
          "GPS取得エラー";

      },

      {
        enableHighAccuracy: true,

        maximumAge: 3000,

        timeout: 15000
      }

    );

}


/* ========================================
   車マーカー
======================================== */

function updateCarMarker() {

  if (!currentPosition) {
    return;
  }


  const carElement =
    document.createElement("div");

  carElement.style.fontSize = "36px";

  carElement.textContent = "🚗";


  if (!carMarker) {

    carMarker =
      new AdvancedMarkerElement({
        map: map,

        position: currentPosition,

        content: carElement,

        title: "現在位置"
      });

  } else {

    carMarker.position =
      currentPosition;

  }

}


/* ========================================
   走行済みルートを記録
======================================== */

function recordTraveledPath() {

  if (!currentPosition) {
    return;
  }


  if (traveledPath.length === 0) {

    traveledPath.push(
      currentPosition
    );

  } else {

    const last =
      traveledPath[
        traveledPath.length - 1
      ];


    if (
      distanceBetween(
        currentPosition,
        last
      ) >= 10
    ) {

      traveledPath.push(
        currentPosition
      );

    }

  }


  drawTraveledRoute();

}


/* ========================================
   走行済みルート描画
======================================== */

function drawTraveledRoute() {

  if (traveledPolyline) {

    traveledPolyline.setMap(null);

  }


  if (traveledPath.length < 2) {
    return;
  }


  traveledPolyline =
    new google.maps.Polyline({

      path: traveledPath,

      strokeColor: "#777777",

      strokeOpacity: 0.9,

      strokeWeight: 8,

      map: map,

      zIndex: 2
    });

}


/* ========================================
   2地点間距離
   Haversine
======================================== */

function distanceBetween(a, b) {

  const R = 6371000;

  const lat1 =
    a.lat * Math.PI / 180;

  const lat2 =
    b.lat * Math.PI / 180;

  const dLat =
    (b.lat - a.lat) *
    Math.PI / 180;

  const dLng =
    (b.lng - a.lng) *
    Math.PI / 180;


  const x =
    Math.sin(dLat / 2) *
    Math.sin(dLat / 2) +
    Math.cos(lat1) *
    Math.cos(lat2) *
    Math.sin(dLng / 2) *
    Math.sin(dLng / 2);


  const c =
    2 *
    Math.atan2(
      Math.sqrt(x),
      Math.sqrt(1 - x)
    );


  return R * c;

}


/* ========================================
   目的地検索
======================================== */

async function searchDestination() {

  const input =
    document.getElementById(
      "destinationInput"
    );


  const query =
    input.value.trim();


  if (!query) {

    alert(
      "目的地を入力してください"
    );

    return;
  }


  if (!map) {
    return;
  }


  const geocoder =
    new google.maps.Geocoder();


  try {

    const result =
      await geocoder.geocode({
        address: query
      });


    if (
      !result.results ||
      result.results.length === 0
    ) {

      alert(
        "目的地が見つかりませんでした"
      );

      return;
    }


    const location =
      result.results[0]
        .geometry
        .location;


    destinationPosition = {
      lat: location.lat(),
      lng: location.lng()
    };


    destinationName =
      result.results[0]
        .formatted_address;


    document.getElementById(
      "destinationName"
    ).textContent =
      query;


    document.getElementById(
      "weatherDestination"
    ).textContent =
      query;


    if (destinationMarker) {

      destinationMarker.map =
        null;

    }


    const destinationElement =
      document.createElement("div");

    destinationElement.style.fontSize =
      "30px";

    destinationElement.textContent =
      "📍";


    destinationMarker =
      new AdvancedMarkerElement({

        map: map,

        position:
          destinationPosition,

        content:
          destinationElement,

        title: query
      });


    initialRouteDistance =
      null;


    lastRouteCalculationPosition =
      null;


    await calculateRoute();


    showOverview();

  } catch (error) {

    console.error(error);

    alert(
      "目的地を検索できませんでした"
    );

  }

}


/* ========================================
   ルート計算
======================================== */

async function calculateRoute() {

  if (
    !currentPosition ||
    !destinationPosition
  ) {

    return;

  }


  try {

    const { routes } =
      await Route.computeRoutes({

        origin:
          currentPosition,

        destination:
          destinationPosition,

        travelMode:
          "DRIVING",

        routingPreference:
          "TRAFFIC_AWARE",

        fields: [
          "path",
          "viewport",
          "distanceMeters",
          "durationMillis"
        ]

      });


    if (
      !routes ||
      routes.length === 0
    ) {

      throw new Error(
        "No route"
      );

    }


    currentRoute =
      routes[0];


    routeViewport =
      currentRoute.viewport;


    if (
      initialRouteDistance === null
    ) {

      initialRouteDistance =
        currentRoute.distanceMeters;

    }


    lastRouteCalculationPosition = {
      lat: currentPosition.lat,
      lng: currentPosition.lng
    };


    drawRemainingRoute();


    updateRouteInfo();


    if (currentScreen === 0) {

      showOverview();

    }

  } catch (error) {

    console.error(error);

    document.getElementById(
      "gpsStatus"
    ).textContent =
      "ルートを取得できませんでした";

  }

}


/* ========================================
   残りルート描画
======================================== */

function drawRemainingRoute() {

  if (routePolyline) {

    routePolyline.setMap(null);

  }


  if (
    !currentRoute ||
    !currentRoute.path
  ) {

    return;

  }


  routePolyline =
    new google.maps.Polyline({

      path: currentRoute.path,

      strokeColor: "#1976d2",

      strokeOpacity: 1,

      strokeWeight: 8,

      map: map,

      zIndex: 3
    });

}


/* ========================================
   ルート情報更新
======================================== */

function updateRouteInfo() {

  if (!currentRoute) {
    return;
  }


  const distance =
    currentRoute.distanceMeters;


  const duration =
    currentRoute.durationMillis;


  const km =
    distance / 1000;


  document.getElementById(
    "remainingDistance"
  ).textContent =
    km.toFixed(2) + " km";


  const minutes =
    Math.max(
      1,
      Math.round(
        duration / 60000
      )
    );


  document.getElementById(
    "remainingTime"
  ).textContent =
    minutes + "分";


  const etaDate =
    new Date(
      Date.now() + duration
    );


  const hh =
    String(
      etaDate.getHours()
    ).padStart(2, "0");


  const mm =
    String(
      etaDate.getMinutes()
    ).padStart(2, "0");


  document.getElementById(
    "eta"
  ).textContent =
    hh + ":" + mm;


  if (
    initialRouteDistance &&
    initialRouteDistance > 0
  ) {

    let progress =
      1 -
      distance /
      initialRouteDistance;


    progress =
      Math.max(
        0,
        Math.min(
          1,
          progress
        )
      );


    document.getElementById(
      "progress"
    ).style.width =
      (progress * 100) + "%";

  }

}


/* ========================================
   画面切り替えタイマー
======================================== */

function startScreenTimer() {

  if (screenTimer) {

    clearInterval(
      screenTimer
    );

  }


  screenTimer =
    setInterval(() => {

      currentScreen =
        (currentScreen + 1) % 3;


      updateScreen();

    }, SCREEN_INTERVAL);

}


/* ========================================
   画面表示
======================================== */

function updateScreen() {

  if (currentScreen === 0) {

    showOverview();

  }

  else if (currentScreen === 1) {

    showCurrentPosition();

  }

  else {

    showWeather();

  }

}


/* ========================================
   ルート全体表示
======================================== */

function showOverview() {

  currentScreen = 0;


  document.getElementById(
    "weatherScreen"
  ).style.display =
    "none";


  setActiveDot(0);


  if (routeViewport) {

    map.fitBounds(
      routeViewport,
      {
        top: 40,
        right: 340,
        bottom: 40,
        left: 40
      }
    );

  }

}


/* ========================================
   現在位置表示
======================================== */

function showCurrentPosition() {

  currentScreen = 1;


  document.getElementById(
    "weatherScreen"
  ).style.display =
    "none";


  setActiveDot(1);


  if (currentPosition) {

    map.setCenter(
      currentPosition
    );

    map.setZoom(17);

  }

}


/* ========================================
   現在位置ボタン
======================================== */

document.getElementById(
  "currentPositionButton"
).addEventListener(
  "click",
  () => {

    currentScreen = 1;

    showCurrentPosition();

  }
);


/* ========================================
   天気表示
======================================== */

async function showWeather() {

  currentScreen = 2;


  document.getElementById(
    "weatherScreen"
  ).style.display =
    "flex";


  setActiveDot(2);


  await loadWeather();

}


/* ========================================
   天気取得
   Open-Meteo
======================================== */

async function loadWeather() {

  if (!destinationPosition) {

    document.getElementById(
      "weatherDescription"
    ).textContent =
      "目的地を設定してください";

    return;

  }


  try {

    const lat =
      destinationPosition.lat;

    const lng =
      destinationPosition.lng;


    const url =
      "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + lat +
      "&longitude=" + lng +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m" +
      "&timezone=auto";


    const response =
      await fetch(url);


    const data =
      await response.json();


    const current =
      data.current;


    document.getElementById(
      "weatherTemp"
    ).textContent =
      Math.round(
        current.temperature_2m
      ) + "°C";


    document.getElementById(
      "weatherFeelsLike"
    ).textContent =
      Math.round(
        current.apparent_temperature
      ) + "°C";


    document.getElementById(
      "weatherHumidity"
    ).textContent =
      Math.round(
        current.relative_humidity_2m
      ) + "%";


    document.getElementById(
      "weatherWind"
    ).textContent =
      Math.round(
        current.wind_speed_10m
      ) + " km/h";


    const weather =
      getWeatherInfo(
        current.weather_code
      );


    document.getElementById(
      "weatherIcon"
    ).textContent =
      weather.icon;


    document.getElementById(
      "weatherDescription"
    ).textContent =
      weather.description;


    const updated =
      new Date();


    document.getElementById(
      "weatherUpdated"
    ).textContent =
      "Updated " +
      updated.toLocaleTimeString(
        "ja-JP",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

  } catch (error) {

    console.error(error);

    document.getElementById(
      "weatherDescription"
    ).textContent =
      "天気情報を取得できませんでした";

  }

}


/* ========================================
   WMO天気コード
======================================== */

function getWeatherInfo(code) {

  if (code === 0) {

    return {
      icon: "☀️",
      description: "快晴"
    };

  }


  if (
    code === 1 ||
    code === 2
  ) {

    return {
      icon: "🌤️",
      description: "晴れ"
    };

  }


  if (code === 3) {

    return {
      icon: "☁️",
      description: "曇り"
    };

  }


  if (
    code >= 45 &&
    code <= 48
  ) {

    return {
      icon: "🌫️",
      description: "霧"
    };

  }


  if (
    code >= 51 &&
    code <= 67
  ) {

    return {
      icon: "🌧️",
      description: "雨"
    };

  }


  if (
    code >= 71 &&
    code <= 77
  ) {

    return {
      icon: "❄️",
      description: "雪"
    };

  }


  if (
    code >= 80 &&
    code <= 82
  ) {

    return {
      icon: "🌦️",
      description: "にわか雨"
    };

  }


  if (
    code >= 95
  ) {

    return {
      icon: "⛈️",
      description: "雷雨"
    };

  }


  return {
    icon: "🌤️",
    description: "天気情報"
  };

}


/* ========================================
   ドット表示
======================================== */

function setActiveDot(index) {

  for (
    let i = 0;
    i < 3;
    i++
  ) {

    const dot =
      document.getElementById(
        "dot" + i
      );


    if (i === index) {

      dot.classList.add(
        "active"
      );

    } else {

      dot.classList.remove(
        "active"
      );

    }

  }

}


/* ========================================
   目的地検索ボタン
======================================== */

document.getElementById(
  "searchButton"
).addEventListener(
  "click",
  searchDestination
);


/* ========================================
   Enterキーでも検索
======================================== */

document.getElementById(
  "destinationInput"
).addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      searchDestination();

    }

  }
);


/* ========================================
   30秒ごとにルート再計算
======================================== */

setInterval(() => {

  if (
    currentPosition &&
    destinationPosition
  ) {

    calculateRoute();

  }

}, ROUTE_RECALC_INTERVAL);


/* ========================================
   Google Maps callback
======================================== */

window.initMap = initMap;
