<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Car Flight Monitor</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont,
                 "Helvetica Neue", Arial, sans-serif;
    background: #000;
}

#app {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
}

#map {
    position: absolute;
    inset: 0;
}

/* =========================
   情報パネル
========================= */

#panel {

    position: absolute;

    top: 0;
    right: 0;

    width: 330px;
    height: 100%;

    background: rgba(5, 10, 18, 0.92);

    color: white;

    padding: 20px;

    z-index: 10;

    display: flex;
    flex-direction: column;

    backdrop-filter: blur(8px);
}

.title {

    font-size: 13px;
    letter-spacing: 2px;

    color: #8fa8c5;

    margin-bottom: 5px;
}

.destination {

    font-size: 24px;
    font-weight: 700;

    margin-bottom: 20px;
}

/* =========================
   数値表示
========================= */

.mainValue {

    font-size: 42px;
    font-weight: 700;

    line-height: 1;

    margin-bottom: 5px;
}

.subValue {

    color: #aeb8c5;

    font-size: 14px;

    margin-bottom: 22px;
}

.infoRow {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 12px 0;

    border-bottom: 1px solid rgba(255,255,255,0.12);
}

.infoLabel {

    color: #91a0b2;

    font-size: 13px;
}

.infoValue {

    font-size: 18px;

    font-weight: 600;
}

/* =========================
   プログレス
========================= */

.progressContainer {

    margin-top: 20px;
}

.progressLabel {

    display: flex;

    justify-content: space-between;

    font-size: 12px;

    color: #9ba8b8;

    margin-bottom: 7px;
}

.progressBar {

    width: 100%;
    height: 7px;

    background: rgba(255,255,255,0.12);

    border-radius: 10px;

    overflow: hidden;
}

.progressFill {

    height: 100%;

    width: 0%;

    background: #38a8ff;

    transition: width 0.8s ease;
}

/* =========================
   GPS
========================= */

.gpsStatus {

    margin-top: auto;

    padding-top: 15px;

    font-size: 12px;

    color: #82ff9b;
}

.gpsButton {

    margin-top: 12px;

    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 8px;

    background: #1d73d5;

    color: white;

    font-size: 15px;

    font-weight: 600;
}

/* =========================
   天気画面
========================= */

#weatherScreen {

    position: absolute;

    inset: 0;

    z-index: 20;

    background:
        linear-gradient(
            180deg,
            rgba(5,15,30,0.97),
            rgba(5,10,18,0.98)
        );

    color: white;

    display: none;

    align-items: center;

    justify-content: center;

    text-align: center;
}

#weatherScreen.visible {

    display: flex;
}

.weatherInner {

    width: min(600px, 90%);

}

.weatherTitle {

    font-size: 14px;

    letter-spacing: 3px;

    color: #8fa8c5;

    margin-bottom: 10px;
}

.weatherDestination {

    font-size: 30px;

    font-weight: 700;

    margin-bottom: 20px;
}

.weatherIcon {

    font-size: 70px;

    margin-bottom: 5px;
}

.weatherDescription {

    font-size: 22px;

    margin-bottom: 20px;
}

.weatherTemperature {

    font-size: 70px;

    font-weight: 700;

    line-height: 1;
}

.weatherFeels {

    color: #9ba8b8;

    margin-top: 10px;

    margin-bottom: 30px;
}

.weatherGrid {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 10px;
}

.weatherItem {

    background: rgba(255,255,255,0.07);

    border-radius: 10px;

    padding: 14px 5px;
}

.weatherItemLabel {

    color: #8fa0b2;

    font-size: 12px;

    margin-bottom: 6px;
}

.weatherItemValue {

    font-size: 17px;

    font-weight: 600;
}

.weatherUpdated {

    margin-top: 20px;

    font-size: 11px;

    color: #68788c;
}

/* =========================
   画面インジケーター
========================= */

#screenIndicator {

    position: absolute;

    bottom: 15px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 30;

    display: flex;

    gap: 8px;

    background: rgba(0,0,0,0.55);

    padding: 7px 10px;

    border-radius: 20px;
}

.dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: rgba(255,255,255,0.35);
}

.dot.active {

    background: white;
}

/* =========================
   凡例
========================= */

#legend {

    position: absolute;

    left: 15px;
    bottom: 15px;

    z-index: 8;

    background: rgba(0,0,0,0.65);

    color: white;

    padding: 10px 12px;

    border-radius: 9px;

    font-size: 11px;

    backdrop-filter: blur(5px);
}

.legendRow {

    display: flex;

    align-items: center;

    gap: 7px;

    margin: 4px 0;
}

.legendLine {

    width: 25px;
    height: 5px;

    border-radius: 5px;
}

.legendDone {
    background: #777;
}

.legendNormal {
    background: #1976d2;
}

.legendSlow {
    background: #ff9800;
}

.legendJam {
    background: #f44336;
}

/* =========================
   縦画面
========================= */

@media (orientation: portrait) {

    #panel {

        top: auto;
        bottom: 0;

        width: 100%;
        height: 235px;

        padding: 12px 16px;
    }

    .destination {

        font-size: 20px;

        margin-bottom: 8px;
    }

    .mainValue {

        font-size: 32px;
    }

    .subValue {

        margin-bottom: 5px;
    }

    .infoRow {

        padding: 7px 0;
    }

    .progressContainer {

        margin-top: 8px;
    }

    .gpsStatus {

        display: none;
    }

    .gpsButton {

        display: none;
    }

    #legend {

        bottom: 245px;
    }
}

</style>
</head>


<body>

<div id="app">

    <div id="map"></div>


    <!-- =========================
         情報パネル
    ========================== -->

    <div id="panel">

        <div class="title">
            CAR FLIGHT MONITOR
        </div>

        <div
            class="destination"
            id="destinationName"
        >
            DESTINATION
        </div>


        <div
            class="mainValue"
            id="remainingDistance"
        >
            --
        </div>

        <div
            class="subValue"
            id="remainingDistanceSub"
        >
            Remaining distance
        </div>


        <div class="infoRow">

            <div class="infoLabel">
                REMAINING TIME
            </div>

            <div
                class="infoValue"
                id="remainingTime"
            >
                --
            </div>

        </div>


        <div class="infoRow">

            <div class="infoLabel">
                ETA
            </div>

            <div
                class="infoValue"
                id="eta"
            >
                --
            </div>

        </div>


        <div class="infoRow">

            <div class="infoLabel">
                GPS ACCURACY
            </div>

            <div
                class="infoValue"
                id="gpsAccuracy"
            >
                --
            </div>

        </div>


        <div class="progressContainer">

            <div class="progressLabel">

                <span>
                    TRIP PROGRESS
                </span>

                <span id="progressText">
                    0%
                </span>

            </div>


            <div class="progressBar">

                <div
                    class="progressFill"
                    id="progressFill"
                ></div>

            </div>

        </div>


        <div
            class="gpsStatus"
            id="gpsStatus"
        >
            GPS WAITING
        </div>


        <button
            class="gpsButton"
            onclick="showCurrentPosition()"

        </button>

    </div>


    <!-- =========================
         凡例
    ========================== -->

    <div id="legend">

        <div class="legendRow">

            <div class="legendLine legendDone"></div>

            <span>走行済み</span>

        </div>


        <div class="legendRow">

            <div class="legendLine legendNormal"></div>

            <span>通常</span>

        </div>


        <div class="legendRow">

            <div class="legendLine legendSlow"></div>

            <span>やや渋滞</span>

        </div>


        <div class="legendRow">

            <div class="legendLine legendJam"></div>

            <span>渋滞</span>

        </div>

    </div>


    <!-- =========================
         天気画面
    ========================== -->

    <div id="weatherScreen">

        <div class="weatherInner">

            <div class="weatherTitle">
                DESTINATION WEATHER
            </div>


            <div
                class="weatherDestination"
                id="weatherDestination"
            >
                --
            </div>


            <div
                class="weatherIcon"
                id="weatherIcon"
            >
                --
            </div>


            <div
                class="weatherDescription"
                id="weatherDescription"
            >
                Loading...
            </div>


            <div
                class="weatherTemperature"
                id="weatherTemperature"
            >
                --
            </div>


            <div
                class="weatherFeels"
                id="weatherFeels"
            >
                --
            </div>


            <div class="weatherGrid">

                <div class="weatherItem">

                    <div class="weatherItemLabel">
                        HUMIDITY
                    </div>

                    <div
                        class="weatherItemValue"
                        id="weatherHumidity"
                    >
                        --
                    </div>

                </div>


                <div class="weatherItem">

                    <div class="weatherItemLabel">
                        WIND
                    </div>

                    <div
                        class="weatherItemValue"
                        id="weatherWind"
                    >
                        --
                    </div>

                </div>


                <div class="weatherItem">

                    <div class="weatherItemLabel">
                        UPDATED
                    </div>

                    <div
                        class="weatherItemValue"

                    >
                        --
                    </div>

                </div>

            </div>


            <div
                class="weatherUpdated"
                id="weatherUpdated"

                Weather data: Open-Meteo
            </div>

        </div>

    </div>


    <!-- =========================
         画面インジケーター
    ========================== -->

    <div id="screenIndicator">

        <div
            class="dot active"
            id="dot0"
        ></div>

        <div
            class="dot"
            id="dot1"
        ></div>

        <div
            class="dot"
            id="dot2"
        ></div>

    </div>

</div>


<script>

/* =========================================================
   設定
========================================================= */

/*
   ★ここだけ変更してください

   出発地・目的地は自由に変更できます。
*/

const DEPARTURE = "横浜駅";

const DESTINATION = "東京駅";


/*
   ルート再計算間隔
*/

const ROUTE_RECALC_INTERVAL = 30000;


/*
   何m動いたらルートを再計算するか
*/

const ROUTE_RECALC_DISTANCE = 150;


/*
   画面切り替え
*/

const SCREEN_INTERVAL = 10000;


/* =========================================================
   グローバル変数
========================================================= */

let map;

let Route;

let AdvancedMarkerElement;

let currentPosition = null;

let departurePosition = null;

let destinationPosition = null;

let departureMarker = null;

let destinationMarker = null;

let carMarker = null;


/*
   現在のルート
*/

let currentRoute = null;


/*
   交通状況付きポリライン
*/

let trafficPolylines = [];


/*
   走行済みルート
*/

let traveledPath = [];

let traveledPolyline = null;


/*
   ルート全体を表示するための情報
*/

let routeViewport = null;


/*
   初回ルート距離
*/

let initialRouteDistance = null;


/*
   前回ルート計算位置
*/

let lastRouteCalculationPosition = null;


/*
   画面
*/

let currentScreen = 0;

let screenTimer = null;


/*
   GPS
*/

let watchId = null;


/*
   天気
*/

let weatherLoaded = false;


/* =========================================================
   Map 初期化
========================================================= */

async function initMap() {

    const { Map } =
        await google.maps.importLibrary("maps");

    const routesLibrary =
        await google.maps.importLibrary("routes");

    const markerLibrary =
        await google.maps.importLibrary("marker");


    Route = routesLibrary.Route;

    AdvancedMarkerElement =
        markerLibrary.AdvancedMarkerElement;


    map = new Map(
        document.getElementById("map"),
        {

            center: {
                lat: 35.681236,
                lng: 139.767125
            },

            zoom: 12,

            mapId: "DEMO_MAP_ID",

            disableDefaultUI: true,

            gestureHandling: "greedy"
        }
    );


    /*
       目的地名を表示
    */

    document.getElementById(
        "destinationName"
    ).textContent = DESTINATION;


    document.getElementById(
        "weatherDestination"
    ).textContent = DESTINATION;


    /*
       出発地・目的地を座標化
    */

    await geocodePlaces();


    /*
       GPS開始
    */

    startGPS();


    /*
       画面切り替え
    */

    startScreenTimer();


    /*
       初回ルート
    */

    calculateRoute();

}


/* =========================================================
   Geocoding
========================================================= */

async function geocodePlaces() {

    const geocoder =
        new google.maps.Geocoder();


    const departureResult =
        await geocoder.geocode({
            address: DEPARTURE
        });


    if (
        !departureResult.results ||
        !departureResult.results.length
    ) {

        throw new Error(
            "出発地を検索できませんでした"
        );

    }


    const departureLocation =
        departureResult.results[0]
            .geometry.location;


    departurePosition = {

        lat: departureLocation.lat(),

        lng: departureLocation.lng()

    };


    const destinationResult =
        await geocoder.geocode({
            address: DESTINATION
        });


    if (
        !destinationResult.results ||
        !destinationResult.results.length
    ) {

        throw new Error(
            "目的地を検索できませんでした"
        );

    }


    const destinationLocation =
        destinationResult.results[0]
            .geometry.location;


    destinationPosition = {

        lat: destinationLocation.lat(),

        lng: destinationLocation.lng()

    };


    /*
       出発地マーカー
    */

    departureMarker =
        new AdvancedMarkerElement({

            map: map,

            position: departurePosition,

            title: "出発地"

        });


    /*
       目的地マーカー
    */

    destinationMarker =
        new AdvancedMarkerElement({

            map: map,

            position: destinationPosition,

            title: "目的地"

        });

}


/* =========================================================
   GPS
========================================================= */

function startGPS() {

    if (!navigator.geolocation) {

        document.getElementById(
            "gpsStatus"
        ).textContent =
            "GPS NOT AVAILABLE";

        return;
    }


    document.getElementById(
        "gpsStatus"
    ).textContent =
        "GPS STARTING...";


    watchId =
        navigator.geolocation.watchPosition(

            handleGPS,

            handleGPSError,

            {

                enableHighAccuracy: true,

                maximumAge: 3000,

                timeout: 15000

            }

        );

}


/* =========================================================
   GPS位置更新
========================================================= */

function handleGPS(position) {

    const newPosition = {

        lat: position.coords.latitude,

        lng: position.coords.longitude

    };


    currentPosition = newPosition;


    /*
       GPS精度
    */

    const accuracy =
        Math.round(
            position.coords.accuracy
        );


    document.getElementById(
        "gpsAccuracy"
    ).textContent =
        `±${accuracy}m`;


    document.getElementById(
        "gpsStatus"
    ).textContent =
        `GPS追跡中　精度 ±${accuracy}m`;


    /*
       車マーカー
    */

    updateCarMarker();


    /*
       走行済みルート
    */

    recordTraveledPath(
        currentPosition
    );


    /*
       ルート再計算判定
    */

    if (!lastRouteCalculationPosition) {

        calculateRoute();

    } else {

        const distance =
            distanceBetween(
                lastRouteCalculationPosition,
                currentPosition
            );


        if (
            distance >=
            ROUTE_RECALC_DISTANCE
        ) {

            calculateRoute();

        }

    }


    /*
       現在位置画面なら中央追従
    */

    if (currentScreen === 1) {

        map.setCenter(
            currentPosition
        );

    }

}


/* =========================================================
   GPSエラー
========================================================= */

function handleGPSError(error) {

    document.getElementById(
        "gpsStatus"
    ).textContent =
        "GPS ERROR";

}


/* =========================================================
   車マーカー
========================================================= */

function updateCarMarker() {

    if (!currentPosition) {
        return;
    }


    if (!carMarker) {

        const carElement =
            document.createElement("div");


        carElement.style.fontSize =
            "30px";

        carElement.textContent = "🚗";


        carMarker =
            new AdvancedMarkerElement({

                map: map,

                position: currentPosition,

                content: carElement,

                title: "現在位置"

            });

    } else {

        carMarker.position =
            currentPosition;

    }

}


/* =========================================================
   走行済みルート記録
========================================================= */

function recordTraveledPath(position) {

    if (!position) {
        return;
    }


    /*
       初回
    */

    if (traveledPath.length === 0) {

        traveledPath.push({
            lat: position.lat,
            lng: position.lng
        });

        drawTraveledPath();

        return;
    }


    const last =
        traveledPath[
            traveledPath.length - 1
        ];


    const distance =
        distanceBetween(
            last,
            position
        );


    /*
       10m未満なら記録しない
    */

    if (distance < 10) {
        return;
    }


    traveledPath.push({

        lat: position.lat,

        lng: position.lng

    });


    drawTraveledPath();

}


/* =========================================================
   走行済みルート描画
========================================================= */

function drawTraveledPath() {

    if (
        traveledPath.length < 2
    ) {
        return;
    }


    if (traveledPolyline) {

        traveledPolyline.setMap(
            null
        );

    }


    traveledPolyline =
        new google.maps.Polyline({

            path: traveledPath,

            map: map,

            strokeColor: "#777777",

            strokeOpacity: 0.9,

            strokeWeight: 8,

            zIndex: 2

        });

}


/* =========================================================
   距離計算
========================================================= */

function distanceBetween(
    a,
    b
) {

    const R = 6371000;


    const lat1 =
        a.lat *
        Math.PI /
        180;


    const lat2 =
        b.lat *
        Math.PI /
        180;


    const dLat =
        (b.lat - a.lat) *
        Math.PI /
        180;


    const dLng =
        (b.lng - a.lng) *
        Math.PI /
        180;


    const x =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +
        Math.cos(lat1) *
        Math.cos(lat2) *
        Math.sin(dLng / 2) *
        Math.sin(dLng / 2);


    return (
        2 *
        R *
        Math.atan2(
            Math.sqrt(x),
            Math.sqrt(1 - x)
        )
    );

}


/* =========================================================
   ルート計算
========================================================= */

async function calculateRoute() {

    if (
        !destinationPosition
    ) {
        return;
    }


    /*
       GPSがまだ取得できていない場合は
       出発地から計算
    */

    const origin =
        currentPosition ||
        departurePosition;


    if (!origin) {
        return;
    }


    try {

        document.getElementById(
            "gpsStatus"
        ).textContent =
            "ROUTE CALCULATING...";


        const request = {

            origin: origin,

            destination:
                destinationPosition,

            travelMode: "DRIVING",

            routingPreference:
                "TRAFFIC_AWARE",

            /*
               交通情報を取得
            */

            extraComputations: [
                "TRAFFIC_ON_POLYLINE"
            ],

            /*
               必要なデータ
            */

            fields: [

                "path",

                "viewport",

                "distanceMeters",

                "durationMillis",

                "staticDurationMillis",

                "speedPaths",

                "routeLabels"

            ]

        };


        const result =
            await Route.computeRoutes(
                request
            );


        if (
            !result.routes ||
            result.routes.length === 0
        ) {

            throw new Error(
                "ルートが見つかりません"
            );

        }


        const route =
            result.routes[0];


        currentRoute =
            route;


        /*
           最初のルート距離
        */

        if (
            initialRouteDistance === null
        ) {

            initialRouteDistance =
                route.distanceMeters;

        }


        /*
           再計算位置を保存
        */

        lastRouteCalculationPosition =
            currentPosition
                ? {
                    lat: currentPosition.lat,
                    lng: currentPosition.lng
                }
                : departurePosition;


        /*
           交通情報付きルート描画
        */

        drawTrafficRoute(route);


        /*
           全体表示用viewport
        */

        routeViewport =
            route.viewport;


        /*
           出発地も含める
        */

        if (
            routeViewport &&
            departurePosition
        ) {

            routeViewport.extend(
                departurePosition
            );

        }


        /*
           情報更新
        */

        updateRouteInfo(route);


        /*
           GPS表示
        */

        if (currentPosition) {

            document.getElementById(
                "gpsStatus"
            ).textContent =
                "GPS追跡中";

        }


        /*
           ルート全体画面
        */

        if (currentScreen === 0) {

            showOverview();

        }

    } catch (error) {

        console.error(
            "Route error:",
            error
        );


        document.getElementById(
            "gpsStatus"
        ).textContent =
            "ルートを取得できませんでした";

    }

}


/* =========================================================
   交通情報付きルート描画
========================================================= */

function drawTrafficRoute(route) {

    /*
       前回の交通ルートを削除
    */

    trafficPolylines.forEach(
        polyline => {

            polyline.setMap(null);

        }
    );


    trafficPolylines = [];


    /*
       speedPathsがない場合
       →通常の青ルート
    */

    if (
        !route.speedPaths ||
        route.speedPaths.length === 0
    ) {

        const path =
            route.path.map(
                point => ({
                    lat: point.lat,
                    lng: point.lng
                })
            );


        const polyline =
            new google.maps.Polyline({

                path: path,

                map: map,

                strokeColor: "#1976D2",

                strokeOpacity: 0.95,

                strokeWeight: 8,

                zIndex: 3

            });


        trafficPolylines.push(
            polyline
        );


        return;
    }


    /*
       交通状況ごとに分割
    */

    route.speedPaths.forEach(
        speedPath => {

            if (
                !speedPath.path ||
                speedPath.path.length < 2
            ) {
                return;
            }


            let color =
                "#1976D2";


            /*
               通常
            */

            if (
                speedPath.speed ===
                "NORMAL"
            ) {

                color =
                    "#1976D2";

            }


            /*
               やや渋滞
            */

            else if (
                speedPath.speed ===
                "SLOW"
            ) {

                color =
                    "#FF9800";

            }


            /*
               渋滞
            */

            else if (
                speedPath.speed ===
                "TRAFFIC_JAM"
            ) {

                color =
                    "#F44336";

            }


            const path =
                speedPath.path.map(
                    point => ({

                        lat: point.lat,

                        lng: point.lng

                    })
                );


            const polyline =
                new google.maps.Polyline({

                    path: path,

                    map: map,

                    strokeColor: color,

                    strokeOpacity: 0.95,

                    strokeWeight: 8,

                    zIndex: 3

                });


            trafficPolylines.push(
                polyline
            );

        }
    );

}


/* =========================================================
   ルート情報更新
========================================================= */

function updateRouteInfo(route) {

    const distanceKm =
        route.distanceMeters /
        1000;


    /*
       距離
    */

    if (distanceKm >= 10) {

        document.getElementById(
            "remainingDistance"
        ).textContent =
            `${distanceKm.toFixed(1)} km`;

    } else {

        document.getElementById(
            "remainingDistance"
        ).textContent =
            `${distanceKm.toFixed(2)} km`;

    }


    document.getElementById(
        "remainingDistanceSub"
    ).textContent =
        "Remaining distance";


    /*
       時間
    */

    const minutes =
        Math.round(
            route.durationMillis /
            60000
        );


    document.getElementById(
        "remainingTime"
    ).textContent =
        formatDuration(minutes);


    /*
       ETA
    */

    const eta =
        new Date(
            Date.now() +
            route.durationMillis
        );


    document.getElementById(
        "eta"
    ).textContent =
        formatTime(eta);


    /*
       進捗
    */

    let progress = 0;


    if (
        initialRouteDistance &&
        route.distanceMeters <
        initialRouteDistance
    ) {

        progress =
            1 -
            (
                route.distanceMeters /
                initialRouteDistance
            );

    }


    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    const percent =
        Math.round(
            progress * 100
        );


    document.getElementById(
        "progressText"
    ).textContent =
        `${percent}%`;


    document.getElementById(
        "progressFill"
    ).style.width =
        `${percent}%`;

}


/* =========================================================
   時間表示
========================================================= */

function formatDuration(
    minutes
) {

    if (minutes < 60) {

        return `${minutes}分`;

    }


    const hours =
        Math.floor(
            minutes / 60
        );


    const mins =
        minutes % 60;


    return `${hours}時間${mins}分`;

}


/* =========================================================
   時刻表示
========================================================= */

function formatTime(date) {

    return date.toLocaleTimeString(
        "ja-JP",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   画面切り替え
========================================================= */

function startScreenTimer() {

    if (screenTimer) {

        clearInterval(
            screenTimer
        );

    }


    screenTimer =
        setInterval(

            () => {

                currentScreen++;

                if (
                    currentScreen > 2
                ) {

                    currentScreen = 0;

                }


                showScreen(
                    currentScreen
                );

            },

            SCREEN_INTERVAL

        );

}


/* =========================================================
   画面表示
========================================================= */

function showScreen(
    screen
) {

    currentScreen =
        screen;


    /*
       天気画面を一旦消す
    */

    document
        .getElementById(
            "weatherScreen"
        )
        .classList.remove(
            "visible"
        );


    /*
       インジケーター
    */

    for (
        let i = 0;
        i < 3;
        i++
    ) {

        document
            .getElementById(
                `dot${i}`
            )
            .classList.toggle(
                "active",
                i === screen
            );

    }


    /*
       画面1
       全体ルート
    */

    if (screen === 0) {

        showOverview();

    }


    /*
       画面2
       現在位置
    */

    if (screen === 1) {

        showCurrentPosition();

    }


    /*
       画面3
       天気
    */

    if (screen === 2) {

        document
            .getElementById(
                "weatherScreen"
            )
            .classList.add(
                "visible"
            );


        loadWeather();

    }

}


/* =========================================================
   全体ルート表示
========================================================= */

function showOverview() {

    if (!map) {
        return;
    }


    if (routeViewport) {

        map.fitBounds(
            routeViewport,
            50
        );

    }

}


/* =========================================================
   現在位置画面
========================================================= */

function showCurrentPosition() {

    currentScreen = 1;


    document
        .getElementById(
            "weatherScreen"
        )
        .classList.remove(
            "visible"
        );


    /*
       インジケーター
    */

    for (
        let i = 0;
        i < 3;
        i++
    ) {

        document
            .getElementById(
                `dot${i}`
            )
            .classList.toggle(
                "active",
                i === 1
            );

    }


    if (!currentPosition) {
        return;
    }


    map.setCenter(
        currentPosition
    );


    /*
       現在位置を拡大
    */

    map.setZoom(17);

}


/* =========================================================
   天気取得
========================================================= */

async function loadWeather() {

    if (
        !destinationPosition
    ) {
        return;
    }


    try {

        const lat =
            destinationPosition.lat;


        const lng =
            destinationPosition.lng;


        const url =
            `https://api.open-meteo.com/v1/forecast` +
            `?latitude=${lat}` +
            `&longitude=${lng}` +
            `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m` +
            `&timezone=auto`;


        const response =
            await fetch(url);


        const data =
            await response.json();


        const current =
            data.current;


        /*
           天気コード
        */

        const weather =
            getWeatherInfo(
                current.weather_code
            );


        document.getElementById(
            "weatherIcon"
        ).textContent =
            weather.icon;


        document.getElementById(
            "weatherDescription"
        ).textContent =
            weather.text;


        document.getElementById(
            "weatherTemperature"
        ).textContent =
            `${Math.round(
                current.temperature_2m
            )}°`;


        document.getElementById(
            "weatherFeels"
        ).textContent =
            `体感 ${Math.round(
                current.apparent_temperature
            )}°`;


        document.getElementById(
            "weatherHumidity"
        ).textContent =
            `${current.relative_humidity_2m}%`;


        document.getElementById(
            "weatherWind"
        ).textContent =
            `${Math.round(
                current.wind_speed_10m
            )} km/h`;


        const updated =
            new Date();


        document.getElementById(
            "weatherUpdatedSmall"
        ).textContent =
            formatTime(updated);


        document.getElementById(
            "weatherUpdated"
        ).textContent =
            "Weather data: Open-Meteo";


        weatherLoaded = true;


    } catch (error) {

        console.error(
            "Weather error:",
            error
        );


        document.getElementById(
            "weatherDescription"
        ).textContent =
            "天気を取得できませんでした";

    }

}


/* =========================================================
   天気コード
========================================================= */

function getWeatherInfo(
    code
) {

    if (code === 0) {

        return {
            icon: "☀️",
            text: "快晴"
        };

    }


    if (
        code === 1 ||
        code === 2
    ) {

        return {
            icon: "🌤️",
            text: "晴れ・一部曇り"
        };

    }


    if (code === 3) {

        return {
            icon: "☁️",
            text: "曇り"
        };

    }


    if (
        code === 45 ||
        code === 48
    ) {

        return {
            icon: "🌫️",
            text: "霧"
        };

    }


    if (
        code >= 51 &&
        code <= 67
    ) {

        return {
            icon: "🌧️",
            text: "雨"
        };

    }


    if (
        code >= 71 &&
        code <= 77
    ) {

        return {
            icon: "❄️",
            text: "雪"
        };

    }


    if (
        code >= 80 &&
        code <= 82
    ) {

        return {
            icon: "🌦️",
            text: "にわか雨"
        };

    }


    if (
        code >= 95 &&
        code <= 99
    ) {

        return {
            icon: "⛈️",
            text: "雷雨"
        };

    }


    return {

        icon: "🌤️",

        text: "不明"

    };

}
