<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>CAR FLIGHT MONITOR</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05080d;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    position: relative;
    background: #05080d;
}

/* =========================================
   MAP
========================================= */

#map {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* =========================================
   RIGHT INFORMATION PANEL
========================================= */

#panel {
    position: absolute;

    top: 0;
    right: 0;
    bottom: 0;

    width: 31%;
    min-width: 300px;
    max-width: 430px;

    background:
        linear-gradient(
            180deg,
            rgba(8,14,22,0.97),
            rgba(5,9,15,0.97)
        );

    border-left: 1px solid #263242;

    padding:
        max(16px, env(safe-area-inset-top))
        20px
        max(16px, env(safe-area-inset-bottom))
        20px;

    display: flex;
    flex-direction: column;

    z-index: 10;
}

/* =========================================
   HEADER
========================================= */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 10px;
}

.title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #91a2b7;
}

.live {
    display: flex;
    align-items: center;
    gap: 6px;

    font-size: 10px;
    letter-spacing: 1px;
    color: #63e6a5;
    font-weight: 700;
}

.live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;

    background: #63e6a5;

    box-shadow:
        0 0 8px #63e6a5;
}

/* =========================================
   DESTINATION
========================================= */

.destination-label {
    font-size: 9px;
    color: #71849a;
    letter-spacing: 2px;
    margin-top: 5px;
}

#destinationDisplay {
    font-size: clamp(22px, 3vw, 34px);
    font-weight: 700;
    line-height: 1.15;

    margin-top: 3px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================================
   SEARCH
========================================= */

.search-area {
    display: flex;
    gap: 7px;
    margin-top: 10px;
}

#destinationInput {
    flex: 1;
    min-width: 0;

    height: 40px;

    border:
        1px solid #344255;

    border-radius: 6px;

    background: #111925;

    color: white;

    padding:
        0 11px;

    font-size: 14px;

    outline: none;
}

#destinationInput:focus {
    border-color: #71859e;
}

#routeButton {
    height: 40px;

    border: 0;

    border-radius: 6px;

    padding: 0 13px;

    background: #e7edf5;
    color: #111820;

    font-size: 13px;
    font-weight: 700;

    white-space: nowrap;
}

/* =========================================
   ROUTE INFORMATION
========================================= */

.main-info {
    margin-top: 17px;

    display: grid;
    grid-template-columns: 1fr 1fr;

    border-top:
        1px solid #202c3a;

    border-bottom:
        1px solid #202c3a;
}

.info-box {
    padding: 13px 8px;
}

.info-box + .info-box {
    border-left:
        1px solid #202c3a;
}

.info-label {
    font-size: 9px;
    color: #71849a;
    letter-spacing: 1.5px;
    margin-bottom: 5px;
}

.info-value {
    font-size: clamp(23px, 3vw, 34px);
    font-weight: 700;
    line-height: 1;
}

.info-unit {
    font-size: 11px;
    color: #8b9bad;
    margin-left: 3px;
}

/* =========================================
   ETA
========================================= */

.eta {
    margin-top: 13px;

    display: flex;
    justify-content: space-between;
    align-items: flex-end;
}

.eta-label {
    font-size: 9px;
    color: #71849a;
    letter-spacing: 2px;
}

#etaValue {
    font-size: clamp(27px, 3.5vw, 40px);
    font-weight: 700;
    letter-spacing: 1px;
}

/* =========================================
   PROGRESS
========================================= */

.progress-area {
    margin-top: 15px;
}

.progress-header {
    display: flex;
    justify-content: space-between;

    font-size: 9px;

    color: #71849a;

    letter-spacing: 1px;
}

#progressPercent {
    color: white;
}

.progress-track {
    width: 100%;
    height: 5px;

    background: #273342;

    border-radius: 10px;

    margin-top: 7px;

    overflow: hidden;
}

#progressBar {
    width: 0%;
    height: 100%;

    background: #dfe8f2;

    border-radius: 10px;

    transition:
        width 0.5s ease;
}

/* =========================================
   STATUS
========================================= */

.status-area {
    margin-top: auto;

    border-top:
        1px solid #202c3a;

    padding-top: 12px;
}

#status {
    font-size: 11px;

    color: #a8b6c6;

    min-height: 17px;

    margin-bottom: 8px;

    white-space: pre-line;
}

.gps-row {
    display: flex;

    justify-content: space-between;

    align-items: center;
}

#gpsStatus {
    font-size: 10px;
    color: #63e6a5;
}

#gpsButton {
    border:
        1px solid #39495c;

    background: #111925;

    color: #dbe4ed;

    border-radius: 5px;

    padding:
        7px 10px;

    font-size: 10px;
}

/* =========================================
   SCREEN INDICATOR
========================================= */

#screenIndicator {
    position: absolute;

    left: 18px;
    bottom: 16px;

    z-index: 20;

    display: flex;
    gap: 7px;

    padding: 7px 10px;

    background:
        rgba(5,9,15,0.85);

    border:
        1px solid rgba(255,255,255,0.15);

    border-radius: 20px;

    backdrop-filter: blur(8px);
}

.screen-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #536273;

    transition:
        all 0.3s ease;
}

.screen-dot.active {
    background: white;

    box-shadow:
        0 0 8px rgba(255,255,255,0.8);
}

/* =========================================
   WEATHER SCREEN
========================================= */

#weatherScreen {
    position: absolute;

    inset: 0;

    z-index: 30;

    display: none;

    background:
        linear-gradient(
            145deg,
            #07111d,
            #0b1622 45%,
            #050a11
        );

    padding:
        max(25px, env(safe-area-inset-top))
        max(30px, env(safe-area-inset-right))
        max(25px, env(safe-area-inset-bottom))
        max(30px, env(safe-area-inset-left));
}

#weatherScreen.visible {
    display: flex;

    flex-direction: column;
}

.weather-top {
    display: flex;

    justify-content: space-between;

    align-items: flex-start;
}

.weather-title {
    font-size: 13px;

    letter-spacing: 3px;

    color: #91a2b7;

    font-weight: 700;
}

.weather-destination {
    font-size: clamp(28px, 5vw, 52px);

    font-weight: 700;

    margin-top: 7px;
}

.weather-updated {
    font-size: 10px;

    color: #71849a;

    letter-spacing: 1px;

    text-align: right;
}

.weather-main {
    flex: 1;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: clamp(40px, 8vw, 120px);
}

.weather-icon {
    font-size: clamp(70px, 12vw, 140px);
}

.weather-temp {
    font-size: clamp(60px, 10vw, 120px);

    font-weight: 300;

    line-height: 1;
}

.weather-condition {
    font-size: clamp(16px, 2vw, 25px);

    color: #aebccc;

    margin-top: 10px;
}

.weather-details {
    display: grid;

    grid-template-columns:
        repeat(3, minmax(130px, 1fr));

    gap: 1px;

    background: #263242;

    border:
        1px solid #263242;
}

.weather-box {
    background: #0a111a;

    padding: 18px;

    text-align: center;
}

.weather-box-label {
    font-size: 9px;

    letter-spacing: 2px;

    color: #71849a;

    margin-bottom: 6px;
}

.weather-box-value {
    font-size: clamp(20px, 3vw, 32px);

    font-weight: 600;
}

/* =========================================
   PORTRAIT
========================================= */

@media (orientation: portrait) {

    #panel {
        width: 100%;

        top: auto;

        height: 43%;

        min-width: 0;
        max-width: none;

        border-left: 0;

        border-top:
            1px solid #263242;
    }

    #map {
        height: 100%;
    }

    .weather-main {
        flex-direction: column;

        gap: 15px;
    }

    .weather-details {
        grid-template-columns:
            repeat(3, 1fr);
    }
}

/* =========================================
   SMALL LANDSCAPE
========================================= */

@media
(orientation: landscape)
and (max-height: 500px) {

    #panel {
        width: 31%;

        min-width: 270px;

        padding-top: 9px;
        padding-bottom: 9px;
    }

    .destination-label {
        margin-top: 2px;
    }

    .search-area {
        margin-top: 6px;
    }

    .main-info {
        margin-top: 8px;
    }

    .info-box {
        padding: 8px 6px;
    }

    .eta {
        margin-top: 7px;
    }

    .progress-area {
        margin-top: 7px;
    }

    .status-area {
        padding-top: 7px;
    }
}
</style>
</head>


<body>

<div id="app">

    <!-- MAP -->
    <div id="map"></div>


    <!-- RIGHT PANEL -->
    <div id="panel">

        <div class="header">

            <div class="title">
                CAR FLIGHT MONITOR
            </div>

            <div class="live">
                <span class="live-dot"></span>
                LIVE
            </div>

        </div>


        <div class="destination-label">
            DESTINATION
        </div>


        <div id="destinationDisplay">
            ---
        </div>


        <div class="search-area">

            <input
                id="destinationInput"
                type="text"
                placeholder="目的地を入力"
                autocomplete="off"
            >

            <button id="routeButton">
                ROUTE
            </button>

        </div>


        <div class="main-info">

            <div class="info-box">

                <div class="info-label">
                    REMAINING
                </div>

                <div class="info-value">

                    <span id="distanceValue">
                        ---
                    </span>

                    <span class="info-unit">
                        km
                    </span>

                </div>

            </div>


            <div class="info-box">

                <div class="info-label">
                    TIME
                </div>

                <div class="info-value">

                    <span id="timeValue">
                        ---
                    </span>

                    <span class="info-unit">
                        min
                    </span>

                </div>

            </div>

        </div>


        <div class="eta">

            <div>

                <div class="eta-label">
                    ESTIMATED ARRIVAL
                </div>

            </div>

            <div id="etaValue">
                --:--
            </div>

        </div>


        <div class="progress-area">

            <div class="progress-header">

                <span>
                    TRIP PROGRESS
                </span>

                <span id="progressPercent">
                    0%
                </span>

            </div>


            <div class="progress-track">

                <div id="progressBar"></div>

            </div>

        </div>


        <div class="status-area">

            <div id="status">
                目的地を入力してください
            </div>


            <div class="gps-row">

                <div id="gpsStatus">
                    GPS待機中
                </div>


                <button id="gpsButton">
                    GPS START
                </button>

            </div>

        </div>

    </div>


    <!-- SCREEN INDICATOR -->

    <div id="screenIndicator">

        <div
            class="screen-dot active"
            id="dot0">
        </div>

        <div
            class="screen-dot"
            id="dot1">
        </div>

        <div
            class="screen-dot"
            id="dot2">
        </div>

    </div>


    <!-- WEATHER SCREEN -->

    <div id="weatherScreen">

        <div class="weather-top">

            <div>

                <div class="weather-title">
                    DESTINATION WEATHER
                </div>

                <div
                    class="weather-destination"
                    id="weatherDestination">
                    ---
                </div>

            </div>


            <div
                class="weather-updated"
                id="weatherUpdated">
                WEATHER
            </div>

        </div>


        <div class="weather-main">

            <div
                class="weather-icon"
                id="weatherIcon">
                ☁️
            </div>


            <div>

                <div
                    class="weather-temp"
                    id="weatherTemp">
                    --
                </div>


                <div
                    class="weather-condition"
                    id="weatherCondition">
                    天気情報を取得中
                </div>

            </div>

        </div>


        <div class="weather-details">

            <div class="weather-box">

                <div class="weather-box-label">
                    FEELS LIKE
                </div>

                <div
                    class="weather-box-value"
                    id="weatherFeels">
                    --
                </div>

            </div>


            <div class="weather-box">

                <div class="weather-box-label">
                    HUMIDITY
                </div>

                <div
                    class="weather-box-value"
                    id="weatherHumidity">
                    --
                </div>

            </div>


            <div class="weather-box">

                <div class="weather-box-label">
                    WIND
                </div>

                <div
                    class="weather-box-value"
                    id="weatherWind">
                    --
                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let map;

let carMarker = null;

let currentPosition = null;

let destination = null;

let routeObject = null;

let routePolylines = [];

let initialRouteDistance = null;

let lastRouteUpdatePosition = null;

let gpsWatchId = null;


/*
 * 0 = 全体ルート
 * 1 = 現在位置拡大
 * 2 = 天気
 */

let currentScreen = 0;


/*
 * 10秒ごとに切り替え
 */

const SCREEN_INTERVAL = 10000;


/*
 * 画面切り替えタイマー
 */

let screenTimer = null;


/*
 * 全体ルートを表示するための
 * viewportを保存
 */

let routeViewport = null;


/* =====================================================
   INITIALIZE MAP
===================================================== */

async function initMap() {

    try {

        const { Map } =
            await google.maps.importLibrary("maps");

        await google.maps.importLibrary("marker");


        map = new Map(
            document.getElementById("map"),
            {

                center: {
                    lat: 35.681236,
                    lng: 139.767125
                },

                zoom: 12,

                mapId: "DEMO_MAP_ID",

                disableDefaultUI: true,

                gestureHandling: "greedy"

            }
        );


        document.getElementById("status").textContent =
            "GPSを取得しています…";


        startGPS();


        /*
         * 10秒ごとの画面切り替え
         */

        startScreenTimer();


    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "Google Mapsの初期化に失敗しました。";

    }

}


/* =====================================================
   SCREEN TIMER
===================================================== */

function startScreenTimer() {

    if (screenTimer) {

        clearInterval(screenTimer);

    }


    screenTimer =
        setInterval(
            () => {

                switchToNextScreen();

            },
            SCREEN_INTERVAL
        );

}


/* =====================================================
   SWITCH SCREEN
===================================================== */

function switchToNextScreen() {

    /*
     * 目的地がまだ設定されていない場合は
     * 天気画面を飛ばす
     */

    if (!destination) {

        currentScreen = 0;

    } else {

        currentScreen++;

        if (currentScreen > 2) {

            currentScreen = 0;

        }

    }


    showScreen(currentScreen);

}


/* =====================================================
   SHOW SCREEN
===================================================== */

function showScreen(screen) {

    currentScreen = screen;


    /*
     * インジケーター
     */

    document
        .querySelectorAll(".screen-dot")
        .forEach(
            dot => {

                dot.classList.remove("active");

            }
        );


    const activeDot =
        document.getElementById(
            "dot" + screen
        );


    if (activeDot) {

        activeDot.classList.add("active");

    }


    /*
     * WEATHER SCREEN
     */

    const weatherScreen =
        document.getElementById(
            "weatherScreen"
        );


    if (screen === 2 && destination) {

        /*
         * 地図を隠して天気画面
         */

        weatherScreen.classList.add(
            "visible"
        );


        /*
         * 天気取得
         */

        loadWeather();


        return;

    }


    /*
     * 通常画面では天気画面を隠す
     */

    weatherScreen.classList.remove(
        "visible"
    );


    if (!map) {
        return;
    }


    /*
     * SCREEN 0
     * 全体ルート
     */

    if (screen === 0) {

        if (routeViewport) {

            map.fitBounds(
                routeViewport,
                {
                    top: 40,
                    right: 40,
                    bottom: 40,
                    left: 40
                }
            );

        } else if (currentPosition) {

            map.setCenter(
                currentPosition
            );

            map.setZoom(12);

        }

    }


    /*
     * SCREEN 1
     * 現在位置拡大
     */

    if (screen === 1) {

        if (currentPosition) {

            map.setCenter(
                currentPosition
            );

            map.setZoom(17);

        }

    }

}


/* =====================================================
   GPS
===================================================== */

function startGPS() {

    if (!navigator.geolocation) {

        document.getElementById("gpsStatus").textContent =
            "GPS非対応";

        return;

    }


    document.getElementById("gpsStatus").textContent =
        "GPS取得中…";


    navigator.geolocation.getCurrentPosition(

        position => {

            updateGPS(position);

            watchGPS();

        },

        error => {

            console.error(error);

            document.getElementById("gpsStatus").textContent =
                "GPS取得失敗";

            document.getElementById("status").textContent =
                "位置情報を取得できませんでした。";

        },

        {

            enableHighAccuracy: true,

            maximumAge: 0,

            timeout: 15000

        }

    );

}


/* =====================================================
   WATCH GPS
===================================================== */

function watchGPS() {

    if (gpsWatchId !== null) {

        navigator.geolocation.clearWatch(
            gpsWatchId
        );

    }


    gpsWatchId =
        navigator.geolocation.watchPosition(

            position => {

                updateGPS(position);

            },

            error => {

                console.error(error);

                document.getElementById("gpsStatus").textContent =
                    "GPSエラー";

            },

            {

                enableHighAccuracy: true,

                maximumAge: 1000,

                timeout: 15000

            }

        );

}


/* =====================================================
   UPDATE GPS
===================================================== */

function updateGPS(position) {

    const lat =
        position.coords.latitude;

    const lng =
        position.coords.longitude;

    const accuracy =
        position.coords.accuracy;


    currentPosition = {

        lat,
        lng

    };


    document.getElementById("gpsStatus").textContent =
        "GPS追跡中　精度 ±" +
        Math.round(accuracy) +
        "m";


    updateCarMarker();


    /*
     * 現在位置画面なら
     * 常に車を中央付近にする
     */

    if (
        currentScreen === 1 &&
        map
    ) {

        map.setCenter(
            currentPosition
        );

    }


    /*
     * 150m以上移動したら
     * ルート再計算
     */

    if (
        destination &&
        lastRouteUpdatePosition
    ) {

        const moved =
            distanceBetween(
                currentPosition,
                lastRouteUpdatePosition
            );


        if (moved >= 150) {

            calculateRoute(false);

        }

    }

}


/* =====================================================
   CAR MARKER
===================================================== */

function updateCarMarker() {

    if (
        !map ||
        !currentPosition
    ) {

        return;

    }


    if (!carMarker) {

        const carElement =
            document.createElement("div");


        carElement.innerHTML =
            "🚗";


        carElement.style.fontSize =
            "30px";


        carElement.style.filter =
            "drop-shadow(0 2px 4px rgba(0,0,0,.8))";


        carMarker =
            new google.maps.marker.AdvancedMarkerElement({

                map: map,

                position: currentPosition,

                content: carElement,

                title: "現在地"

            });

    } else {

        carMarker.position =
            currentPosition;

    }

}


/* =====================================================
   ROUTE INPUT
===================================================== */

document
    .getElementById("routeButton")
    .addEventListener(
        "click",
        calculateRouteFromInput
    );


document
    .getElementById("destinationInput")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                calculateRouteFromInput();

            }

        }
    );


/* =====================================================
   DESTINATION SEARCH
===================================================== */

async function calculateRouteFromInput() {

    const input =
        document
            .getElementById("destinationInput")
            .value
            .trim();


    if (!input) {

        document.getElementById("status").textContent =
            "目的地を入力してください。";

        return;

    }


    if (!currentPosition) {

        document.getElementById("status").textContent =
            "GPS位置を取得中です。";

        return;

    }


    document.getElementById("status").textContent =
        "ルートを検索しています…";


    try {

        const geocoder =
            new google.maps.Geocoder();


        geocoder.geocode(

            {

                address: input,

                region: "JP"

            },

            results => {

                if (
                    !results ||
                    !results.length
                ) {

                    document.getElementById("status").textContent =
                        "目的地が見つかりませんでした。";

                    return;

                }


                const location =
                    results[0]
                        .geometry
                        .location;


                destination = {

                    lat:
                        location.lat(),

                    lng:
                        location.lng(),

                    name:
                        results[0]
                            .formatted_address

                };


                document.getElementById(
                    "destinationDisplay"
                ).textContent =
                    input;


                document.getElementById(
                    "weatherDestination"
                ).textContent =
                    input;


                initialRouteDistance =
                    null;


                currentScreen = 0;


                calculateRoute(true);

            }

        );

    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "目的地の検索に失敗しました。";

    }

}


/* =====================================================
   CALCULATE ROUTE
===================================================== */

async function calculateRoute(fitMap) {

    if (
        !currentPosition ||
        !destination
    ) {

        return;

    }


    try {

        const { Route } =
            await google.maps.importLibrary(
                "routes"
            );


        const request = {

            origin:
                currentPosition,

            destination:
                destination,

            travelMode:
                "DRIVING",

            routingPreference:
                "TRAFFIC_AWARE",

            fields: [

                "path",

                "viewport",

                "distanceMeters",

                "durationMillis",

                "localizedValues",

                "legs"

            ]

        };


        const response =
            await Route.computeRoutes(
                request
            );


        if (
            !response ||
            !response.routes ||
            !response.routes.length
        ) {

            document.getElementById("status").textContent =
                "ルートを取得できませんでした。";

            return;

        }


        routeObject =
            response.routes[0];


        /*
         * 初回の総距離
         */

        if (
            initialRouteDistance === null
        ) {

            initialRouteDistance =
                routeObject.distanceMeters;

        }


        /*
         * 全体表示用viewport
         */

        routeViewport =
            routeObject.viewport;


        /*
         * 古いルートを削除
         */

        clearRoute();


        /*
         * 新しいルート
         */

        routePolylines =
            routeObject.createPolylines({

                polylineOptions: {

                    strokeColor:
                        "#4285F4",

                    strokeOpacity:
                        0.9,

                    strokeWeight:
                        6

                }

            });


        routePolylines.forEach(
            polyline => {

                polyline.setMap(map);

            }
        );


        /*
         * 初回のみ全体表示
         */

        if (
            fitMap &&
            routeViewport
        ) {

            map.fitBounds(
                routeViewport,
                {

                    top: 40,

                    right: 40,

                    bottom: 40,

                    left: 40

                }
            );

        }


        lastRouteUpdatePosition = {

            ...currentPosition

        };


        updateRouteInformation();


        document.getElementById("status").textContent =
            "走行中";


    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "ルートを取得できませんでした。\n" +
            error.message;

    }

}


/* =====================================================
   CLEAR ROUTE
===================================================== */

function clearRoute() {

    routePolylines.forEach(
        polyline => {

            polyline.setMap(null);

        }
    );


    routePolylines = [];

}


/* =====================================================
   ROUTE INFORMATION
===================================================== */

function updateRouteInformation() {

    if (!routeObject) {

        return;

    }


    const distanceMeters =
        routeObject.distanceMeters || 0;


    const durationMillis =
        routeObject.durationMillis || 0;


    const distanceKm =
        distanceMeters / 1000;


    document.getElementById(
        "distanceValue"
    ).textContent =
        distanceKm.toFixed(1);


    const minutes =
        Math.max(
            0,

            Math.round(
                durationMillis /
                60000
            )
        );


    document.getElementById(
        "timeValue"
    ).textContent =
        minutes;


    /*
     * ETA
     */

    const eta =
        new Date(
            Date.now() +
            durationMillis
        );


    const hours =
        String(
            eta.getHours()
        ).padStart(
            2,
            "0"
        );


    const mins =
        String(
            eta.getMinutes()
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "etaValue"
    ).textContent =
        hours + ":" + mins;


    /*
     * 進捗
     */

    if (
        initialRouteDistance &&
        initialRouteDistance > 0
    ) {

        let progress =
            1 -
            (
                distanceMeters /
                initialRouteDistance
            );


        progress =
            Math.max(
                0,
                Math.min(
                    1,
                    progress
                )
            );


        const percent =
            Math.round(
                progress * 100
            );


        document.getElementById(
            "progressBar"
        ).style.width =
            percent + "%";


        document.getElementById(
            "progressPercent"
        ).textContent =
            percent + "%";

    }

}


/* =====================================================
   DISTANCE
===================================================== */

function distanceBetween(a, b) {

    const R = 6371000;


    const lat1 =
        a.lat *
        Math.PI /
        180;


    const lat2 =
        b.lat *
        Math.PI /
        180;


    const dLat =
        (
            b.lat -
            a.lat
        ) *
        Math.PI /
        180;


    const dLng =
        (
            b.lng -
            a.lng
        ) *
        Math.PI /
        180;


    const x =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(lat1) *
        Math.cos(lat2) *

        Math.sin(dLng / 2) *
        Math.sin(dLng / 2);


    const c =
        2 *
        Math.atan2(
            Math.sqrt(x),
            Math.sqrt(1 - x)
        );


    return R * c;

}


/* =====================================================
   WEATHER
===================================================== */

async function loadWeather() {

    if (!destination) {

        return;

    }


    try {

        /*
         * Open-Meteo
         * APIキー不要
         */

        const url =
            "https://api.open-meteo.com/v1/forecast" +
            "?latitude=" +
            encodeURIComponent(
                destination.lat
            ) +
            "&longitude=" +
            encodeURIComponent(
                destination.lng
            ) +
            "&current=" +
            "temperature_2m," +
            "relative_humidity_2m," +
            "apparent_temperature," +
            "weather_code," +
            "wind_speed_10m" +
            "&timezone=auto";


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "Weather API error"
            );

        }


        const data =
            await response.json();


        if (
            !data.current
        ) {

            throw new Error(
                "Weather data unavailable"
            );

        }


        const weather =
            data.current;


        /*
         * 気温
         */

        document.getElementById(
            "weatherTemp"
        ).textContent =
            Math.round(
                weather.temperature_2m
            ) +
            "°";


        /*
         * 体感温度
         */

        document.getElementById(
            "weatherFeels"
        ).textContent =
            Math.round(
                weather.apparent_temperature
            ) +
            "°";


        /*
         * 湿度
         */

        document.getElementById(
            "weatherHumidity"
        ).textContent =
            Math.round(
                weather.relative_humidity_2m
            ) +
            "%";


        /*
         * 風速
         */

        document.getElementById(
            "weatherWind"
        ).textContent =
            Math.round(
                weather.wind_speed_10m
            ) +
            " km/h";


        /*
         * 天気コード
         */

        const weatherInfo =
            getWeatherInfo(
                weather.weather_code
            );


        document.getElementById(
            "weatherIcon"
        ).textContent =
            weatherInfo.icon;


        document.getElementById(
            "weatherCondition"
        ).textContent =
            weatherInfo.text;


        /*
         * 更新時刻
         */

        const updateTime =
            new Date();


        document.getElementById(
            "weatherUpdated"
        ).textContent =
            "UPDATED " +
            String(
                updateTime.getHours()
            ).padStart(2, "0") +
            ":" +
            String(
                updateTime.getMinutes()
            ).padStart(2, "0");

    } catch (error) {

        console.error(error);

        document.getElementById(
            "weatherCondition"
        ).textContent =
            "天気情報を取得できませんでした";

    }

}


/* =====================================================
   WEATHER CODE
===================================================== */

function getWeatherInfo(code) {

    if (code === 0) {

        return {
            icon: "☀️",
            text: "快晴"
        };

    }


    if (
        code === 1 ||
        code === 2
    ) {

        return {
            icon: "🌤️",
            text: "晴れ・一部曇り"
        };

    }


    if (code === 3) {

        return {
            icon: "☁️",
            text: "曇り"
        };

    }


    if (
        code === 45 ||
        code === 48
    ) {

        return {
            icon: "🌫️",
            text: "霧"
        };

    }


    if (
        code >= 51 &&
        code <= 57
    ) {

        return {
            icon: "🌦️",
            text: "霧雨"
        };

    }


    if (
        code >= 61 &&
        code <= 67
    ) {

        return {
            icon: "🌧️",
            text: "雨"
        };

    }


    if (
        code >= 71 &&
        code <= 77
    ) {

        return {
            icon: "🌨️",
            text: "雪"
        };

    }


    if (
        code >= 80 &&
        code <= 82
    ) {

        return {
            icon: "🌧️",
            text: "にわか雨"
        };

    }


    if (
        code >= 95 &&
        code <= 99
    ) {

        return {
            icon: "⛈️",
            text: "雷雨"
        };

    }


    return {

        icon: "☁️",

        text: "天気情報"

    };

}

===================================================== */

setInterval(

    () => {

        if (
            destination &&
            currentPosition
        ) {

            calculateRoute(false);

        }

    },

);
