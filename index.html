<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Car Flight Map</title>


<style>

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #05070a;
    color: white;
}


#app {

    width: 100%;
    height: 100%;

    position: relative;

    overflow: hidden;
}


/* =========================================================
   MAP
========================================================= */

#map {

    width: 100%;
    height: 100%;

}


/* =========================================================
   TOP PANEL
========================================================= */

#topPanel {

    position: absolute;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    width: min(600px, calc(100% - 30px));

    background:
        rgba(10, 14, 20, 0.94);

    backdrop-filter: blur(12px);

    border-radius: 18px;

    padding: 15px;

    z-index: 10;

    box-shadow:
        0 8px 30px rgba(0,0,0,.4);

}


#destinationInput {

    width: 100%;

    height: 46px;

    border: none;

    border-radius: 10px;

    padding:
        0 14px;

    font-size: 16px;

    outline: none;

}


#routeButton {

    width: 100%;

    height: 44px;

    margin-top: 9px;

    border: none;

    border-radius: 10px;

    background: #1976d2;

    color: white;

    font-size: 16px;

    font-weight: 600;

}


#routeButton:active {

    background: #1565c0;

}


/* =========================================================
   FLIGHT PANEL
========================================================= */

#flightPanel {

    position: absolute;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    width: min(700px, calc(100% - 30px));

    background:
        rgba(5, 9, 15, 0.95);

    backdrop-filter: blur(15px);

    border-radius: 22px;

    padding: 22px;

    z-index: 10;

    box-shadow:
        0 10px 40px rgba(0,0,0,.5);

}


#destinationName {

    text-align: center;

    font-size: 18px;

    font-weight: 600;

    margin-bottom: 5px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


#status {

    text-align: center;

    color: #9aa4b2;

    font-size: 13px;

    margin-bottom: 18px;

}


/* =========================================================
   PROGRESS
========================================================= */

#progressContainer {

    position: relative;

    height: 45px;

    margin:
        0 10px 20px 10px;

}


#progressBackground {

    position: absolute;

    top: 21px;

    left: 0;
    right: 0;

    height: 4px;

    background: #39414c;

    border-radius: 3px;

}


#progressBar {

    position: absolute;

    top: 21px;

    left: 0;

    height: 4px;

    width: 0%;

    background: #42a5f5;

    border-radius: 3px;

    transition:
        width .8s ease;

}


#carIcon {

    position: absolute;

    top: 5px;

    left: 0%;

    transform:
        translateX(-50%);

    font-size: 25px;

    transition:
        left .8s ease;

}


#startDot,
#endDot {

    position: absolute;

    top: 16px;

    width: 14px;
    height: 14px;

    border-radius: 50%;

    background: white;

}


#startDot {

    left: 0;

}


#endDot {

    right: 0;

}


/* =========================================================
   STATS
========================================================= */

#stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    text-align: center;

    gap: 10px;

}


.statLabel {

    color: #8d98a6;

    font-size: 12px;

    margin-bottom: 4px;

}


.statValue {

    font-size: 24px;

    font-weight: 600;

}


.statUnit {

    font-size: 12px;

    color: #8d98a6;

    margin-left: 3px;

}


/* =========================================================
   GPS BUTTON
========================================================= */

#gpsButton {

    position: absolute;

    right: 18px;

    bottom: 230px;

    width: 52px;
    height: 52px;

    border-radius: 50%;

    border: none;

    background: white;

    font-size: 24px;

    cursor: pointer;

    z-index: 10;

    box-shadow:
        0 3px 12px rgba(0,0,0,.4);

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    #topPanel {

        top: 12px;

    }


    #flightPanel {

        bottom: 10px;

        padding: 18px;

    }


    .statValue {

        font-size: 20px;

    }


    #gpsButton {

        bottom: 240px;

    }

}

</style>

</head>


<body>


<div id="app">


    <!-- =====================================================
         MAP
    ====================================================== -->

    <div id="map"></div>


    <!-- =====================================================
         DESTINATION
    ====================================================== -->

    <div id="topPanel">


        <input
            id="destinationInput"
            type="text"
            placeholder="目的地を入力（例：東京駅）"
            autocomplete="off"
        >


        <button id="routeButton">

            🚗 ルートを検索

        </button>


    </div>


    <!-- =====================================================
         GPS BUTTON
    ====================================================== -->

    <button
        id="gpsButton"
        title="現在地へ移動"
    >

        ◎

    </button>


    <!-- =====================================================
         FLIGHT STYLE PANEL
    ====================================================== -->

    <div id="flightPanel">


        <div id="destinationName">

            DESTINATION

        </div>


        <div id="status">

            GPSを起動しています...

        </div>


        <!-- Progress -->

        <div id="progressContainer">


            <div id="progressBackground"></div>


            <div id="progressBar"></div>


            <div id="carIcon">

                🚗

            </div>


            <div id="startDot"></div>


            <div id="endDot"></div>


        </div>


        <!-- Stats -->

        <div id="stats">


            <div>

                <div class="statLabel">

                    残り距離

                </div>


                <div class="statValue">

                    <span id="remainingDistance">

                        --

                    </span>

                    <span class="statUnit">

                        km

                    </span>

                </div>

            </div>


            <div>

                <div class="statLabel">

                    残り時間

                </div>


                <div class="statValue">

                    <span id="remainingTime">

                        --

                    </span>

                    <span class="statUnit">

                        min

                    </span>

                </div>

            </div>


            <div>

                <div class="statLabel">

                    到着予定

                </div>


                <div class="statValue">

                    <span id="arrivalTime">

                        --:--

                    </span>

                </div>

            </div>


        </div>


    </div>


</div>



<script>


/* =========================================================
   GLOBAL VARIABLES
========================================================= */


let map = null;

let Route = null;

let AdvancedMarkerElement = null;


let currentPosition = null;

let routeObject = null;

let routePolylines = [];

let carMarker = null;


let watchId = null;


/*
 * 入力された目的地
 */

let destinationText = "";


/*
 * 最初に検索したルート距離
 */

let initialRouteDistance = null;


/*
 * 最後にルートを再計算した時刻
 */

let lastRouteCalculationTime = 0;


/*
 * 最後に再計算した位置
 */

let lastRouteCalculationPosition = null;


/*
 * ルート再計算中かどうか
 */

let routeCalculationInProgress = false;


/*
 * 30秒ごとに再計算
 */

const ROUTE_UPDATE_INTERVAL = 30000;


/*
 * 少なくとも150m動いたら再計算
 */

const ROUTE_UPDATE_DISTANCE = 150;


/* =========================================================
   INITIALIZE GOOGLE MAP
========================================================= */


async function initMap() {


    try {


        const mapsLibrary =
            await google.maps.importLibrary(
                "maps"
            );


        const routesLibrary =
            await google.maps.importLibrary(
                "routes"
            );


        const markerLibrary =
            await google.maps.importLibrary(
                "marker"
            );


        const Map =
            mapsLibrary.Map;


        Route =
            routesLibrary.Route;


        AdvancedMarkerElement =
            markerLibrary.AdvancedMarkerElement;


        /*
         * Map
         */

        map =
            new Map(
                document.getElementById("map"),
                {

                    center: {
                        lat: 35.4437,
                        lng: 139.6380
                    },

                    zoom: 15,

                    mapTypeControl: false,

                    streetViewControl: false,

                    fullscreenControl: false,

                    mapId: "DEMO_MAP_ID"

                }
            );


        /*
         * GPS開始
         */

        startGPS();


        /*
         * ルートボタン
         */

        document
            .getElementById("routeButton")
            .addEventListener(
                "click",
                calculateRoute
            );


        /*
         * GPSボタン
         */

        document
            .getElementById("gpsButton")
            .addEventListener(
                "click",
                centerOnCurrentLocation
            );


        /*
         * Enterキーでも検索
         */

        document
            .getElementById("destinationInput")
            .addEventListener(
                "keydown",
                event => {

                    if (
                        event.key === "Enter"
                    ) {

                        calculateRoute();

                    }

                }
            );


    } catch (error) {


        console.error(
            "Google Maps initialization error:",
            error
        );


        document
            .getElementById("status")
            .textContent =
            "Google Mapsの初期化に失敗しました";

    }

}


/* =========================================================
   GPS
========================================================= */


function startGPS() {


    const statusElement =
        document.getElementById("status");


    statusElement.textContent =
        "GPSを起動しています...";


    /*
     * GPS対応確認
     */

    if (!navigator.geolocation) {

        statusElement.textContent =
            "このiPhoneでは位置情報を取得できません";

        return;

    }


    /*
     * HTTPS確認
     */

    if (
        location.protocol !== "https:"
    ) {

        statusElement.textContent =
            "HTTPS接続が必要です";

        return;

    }


    statusElement.textContent =
        "iPhoneから現在地を取得中...";


    /*
     * 最初の1回を取得
     */

    navigator.geolocation.getCurrentPosition(

        position => {


            console.log(
                "GPS SUCCESS:",
                position
            );


            currentPosition = {

                lat:
                    position.coords.latitude,

                lng:
                    position.coords.longitude

            };


            statusElement.textContent =
                "現在地を取得しました";


            /*
             * 現在地へ移動
             */

            map.setCenter(
                currentPosition
            );


            map.setZoom(16);


            /*
             * 車マーカー
             */

            updateCarPosition();


            /*
             * GPS継続監視
             */

            startGPSWatch();


        },


        error => {


            console.error(
                "GPS ERROR:",
                error
            );


            let message =
                "GPSエラー";


            if (
                error.code === 1
            ) {

                message =
                    "位置情報の使用が許可されていません";

            }


            else if (
                error.code === 2
            ) {

                message =
                    "現在地を取得できませんでした";

            }


            else if (
                error.code === 3
            ) {

                message =
                    "GPS取得がタイムアウトしました";

            }


            statusElement.textContent =
                message +
                "（エラーコード " +
                error.code +
                "）";


        },


        {

            enableHighAccuracy: true,

            timeout: 20000,

            maximumAge: 0

        }

    );

}


/* =========================================================
   GPS WATCH
========================================================= */


function startGPSWatch() {


    if (
        watchId !== null
    ) {

        navigator.geolocation.clearWatch(
            watchId
        );

    }


    watchId =
        navigator.geolocation.watchPosition(

            position => {


                const newPosition = {

                    lat:
                        position.coords.latitude,

                    lng:
                        position.coords.longitude

                };


                currentPosition =
                    newPosition;


                /*
                 * GPS状態表示
                 */

                document
                    .getElementById("status")
                    .textContent =
                    "GPS追跡中　精度 ±" +
                    Math.round(
                        position.coords.accuracy
                    ) +
                    "m";


                /*
                 * 車を移動
                 */

                updateCarPosition();


                /*
                 * ルートがあれば
                 * 必要に応じて再計算
                 */

                if (
                    routeObject &&
                    destinationText
                ) {

                    maybeRefreshRoute();

                }

            },


            error => {


                console.error(
                    "GPS WATCH ERROR:",
                    error
                );


                document
                    .getElementById("status")
                    .textContent =
                    "GPS更新エラー（コード " +
                    error.code +
                    "）";


            },


            {

                enableHighAccuracy: true,

                maximumAge: 2000,

                timeout: 20000

            }

        );

}


/* =========================================================
   CAR MARKER
========================================================= */


function updateCarPosition() {


    if (
        !currentPosition ||
        !map ||
        !AdvancedMarkerElement
    ) {

        return;

    }


    /*
     * 最初のマーカー
     */

    if (!carMarker) {


        carMarker =
            new AdvancedMarkerElement({

                map: map,

                position:
                    currentPosition,

                title:
                    "現在位置"

            });


        return;

    }


    /*
     * GPS更新
     */

    carMarker.position =
        currentPosition;

}


/* =========================================================
   CENTER GPS
========================================================= */


function centerOnCurrentLocation() {


    if (!currentPosition) {


        alert(
            "まだGPS位置を取得できていません"
        );


        return;

    }


    map.panTo(
        currentPosition
    );


    map.setZoom(17);

}


/* =========================================================
   CALCULATE ROUTE
========================================================= */


async function calculateRoute() {


    if (!currentPosition) {


        alert(
            "現在位置をまだ取得できていません。\n" +
            "GPSを取得してから再度お試しください。"
        );


        return;

    }


    const input =
        document
            .getElementById(
                "destinationInput"
            );


    destinationText =
        input.value.trim();


    if (!destinationText) {


        alert(
            "目的地を入力してください"
        );


        return;

    }


    /*
     * 同じ目的地で検索し直す場合も
     * 最初からスタート扱い
     */

    initialRouteDistance =
        null;


    lastRouteCalculationTime =
        0;


    lastRouteCalculationPosition =
        null;


    await refreshRoute(
        true
    );

}


/* =========================================================
   REFRESH ROUTE
========================================================= */


async function refreshRoute(
    firstSearch = false
) {


    if (
        !currentPosition ||
        !destinationText ||
        routeCalculationInProgress
    ) {

        return;

    }


    routeCalculationInProgress =
        true;


    const statusElement =
        document.getElementById(
            "status"
        );


    if (firstSearch) {

        statusElement.textContent =
            "ルートを検索しています...";

    }
    else {

        statusElement.textContent =
            "現在地からルートを更新中...";

    }


    try {


        const request = {

            origin:
                currentPosition,

            destination:
                destinationText,

            travelMode:
                "DRIVING",

            routingPreference:
                "TRAFFIC_AWARE",

            fields: [

                "path",

                "viewport",

                "distanceMeters",

                "durationMillis",

                "localizedValues",

                "legs"

            ]

        };


        const result =
            await Route.computeRoutes(
                request
            );


        if (
            !result.routes ||
            result.routes.length === 0
        ) {

            throw new Error(
                "ルートが見つかりません"
            );

        }


        routeObject =
            result.routes[0];


        /*
         * 最初のルート距離を保存
         */

        if (
            initialRouteDistance === null
        ) {

            initialRouteDistance =
                routeObject.distanceMeters;

        }


        /*
         * ルート描画
         */

        drawRoute(
            firstSearch
        );


        /*
         * 距離・時間表示
         */

        updateRouteInformation();


        /*
         * 再計算情報を保存
         */

        lastRouteCalculationTime =
            Date.now();


        lastRouteCalculationPosition = {

            lat:
                currentPosition.lat,

            lng:
                currentPosition.lng

        };


        /*
         * GPS状態へ戻す
         */

        statusElement.textContent =
            "GPS追跡中";


    }


    catch (error) {


        console.error(
            "Route error:",
            error
        );


        statusElement.textContent =
            "ルート検索に失敗しました";


        /*
         * 最初の検索だけアラート
         */

        if (firstSearch) {

            alert(
                "ルートを取得できませんでした。\n\n" +
                error.message
            );

        }

    }


    finally {

        routeCalculationInProgress =
            false;

    }

}


/* =========================================================
   ROUTE REFRESH CHECK
========================================================= */


function maybeRefreshRoute() {


    if (
        !routeObject ||
        !currentPosition ||
        !lastRouteCalculationPosition
    ) {

        return;

    }


    const now =
        Date.now();


    const elapsed =
        now -
        lastRouteCalculationTime;


    const moved =
        haversineDistance(

            currentPosition.lat,
            currentPosition.lng,

            lastRouteCalculationPosition.lat,
            lastRouteCalculationPosition.lng

        ) * 1000;


    /*
     * 30秒経過
     * または
     * 150m以上移動
     */

    if (
        elapsed >= ROUTE_UPDATE_INTERVAL ||
        moved >= ROUTE_UPDATE_DISTANCE
    ) {


        refreshRoute(
            false
        );

    }

}


/* =========================================================
   DRAW ROUTE
========================================================= */


function drawRoute(
    firstSearch
) {


    /*
     * 古いルートを削除
     */

    routePolylines.forEach(
        polyline => {

            polyline.setMap(
                null
            );

        }
    );


    routePolylines = [];


    /*
     * 新しいルート
     */

    routePolylines =
        routeObject.createPolylines();


    routePolylines.forEach(
        polyline => {

            polyline.setMap(
                map
            );

        }
    );


    /*
     * 最初の検索だけ
     * ルート全体を表示
     *
     * GPS更新時は
     * ズームを変えない
     */

    if (
        firstSearch &&
        routeObject.viewport
    ) {


        map.fitBounds(
            routeObject.viewport,
            70
        );

    }

}


/* =========================================================
   ROUTE INFORMATION
========================================================= */


function updateRouteInformation() {


    if (!routeObject) {

        return;

    }


    const distance =
        routeObject.distanceMeters;


    const duration =
        routeObject.durationMillis;


    /*
     * 残り距離
     */

    if (
        distance !== undefined &&
        distance !== null
    ) {


        document
            .getElementById(
                "remainingDistance"
            )
            .textContent =
            formatDistance(
                distance
            );

    }


    /*
     * 残り時間
     */

    if (
        duration !== undefined &&
        duration !== null
    ) {


        const minutes =
            Math.max(
                1,
                Math.ceil(
                    duration / 60000
                )
            );


        document
            .getElementById(
                "remainingTime"
            )
            .textContent =
            minutes;


        updateArrivalTime(
            minutes
        );

    }


    /*
     * 目的地名
     */

    document
        .getElementById(
            "destinationName"
        )
        .textContent =
        destinationText.toUpperCase();


    /*
     * 進捗
     */

    updateProgress();

}


/* =========================================================
   DISTANCE FORMAT
========================================================= */


function formatDistance(
    meters
) {


    const km =
        meters / 1000;


    if (
        km < 1
    ) {

        return km.toFixed(2);

    }


    return km.toFixed(1);

}


/* =========================================================
   ARRIVAL TIME
========================================================= */


function updateArrivalTime(
    minutes
) {


    const arrival =
        new Date(
            Date.now() +
            minutes * 60000
        );


    const hours =
        String(
            arrival.getHours()
        ).padStart(
            2,
            "0"
        );


    const mins =
        String(
            arrival.getMinutes()
        ).padStart(
            2,
            "0"
        );


    document
        .getElementById(
            "arrivalTime"
        )
        .textContent =
        `${hours}:${mins}`;

}


/* =========================================================
   PROGRESS
========================================================= */


function updateProgress() {


    if (
        !routeObject ||
        !currentPosition ||
        !initialRouteDistance
    ) {

        return;

    }


    const remainingDistance =
        routeObject.distanceMeters;


    /*
     * 最初のルート距離に対して
     * 現在どこまで進んだかを計算
     */

    let progress =
        1 -
        (
            remainingDistance /
            initialRouteDistance
        );


    progress =
        Math.max(
            0,
            Math.min(
                1,
                progress
            )
        );


    const percentage =
        progress * 100;


    /*
     * プログレスバー
     */

    document
        .getElementById(
            "progressBar"
        )
        .style.width =
        percentage + "%";


    /*
     * 車アイコン
     */

    document
        .getElementById(
            "carIcon"
        )
        .style.left =
        percentage + "%";

}


/* =========================================================
   HAVERSINE DISTANCE
========================================================= */


function haversineDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {


    const R =
        6371;


    const dLat =
        degreesToRadians(
            lat2 - lat1
        );


    const dLon =
        degreesToRadians(
            lon2 - lon1
        );


    const a =
        Math.sin(
            dLat / 2
        ) *
        Math.sin(
            dLat / 2
        ) +

        Math.cos(
            degreesToRadians(
                lat1
            )
        ) *

        Math.cos(
            degreesToRadians(
                lat2
            )
        ) *

        Math.sin(
            dLon / 2
        ) *

        Math.sin(
            dLon / 2
        );


    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );


    return R * c;

}


/* =========================================================
   DEGREES
========================================================= */


function degreesToRadians(
    degrees
) {


    return degrees *
        Math.PI /
        180;

}


/* =========================================================
   START
========================================================= */


window.initMap =
    initMap;


</script>



<!-- =========================================================
